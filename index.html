<style>
  :root {
    color-scheme: light dark;
    --pane-w: min(560px, 88vw); --spine: 36px;
    --bg: #fbfbfa; --panel: #fff; --ink: #1b1b1a; --muted: #6b6b68;
    --line: #e3e3df; --accent: #2a6f97; --on-accent: #fff; --chip: #eef3f6;
    --sb: #c6c6c1; --sb-hover: #a8a8a2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --panel:#1d1f23; --ink:#e8e8e6; --muted:#9a9a96;
            --line:#2c2f34; --accent:#7ab6d9; --on-accent:#16171a; --chip:#232830;
            --sb:#3b3f46; --sb-hover:#4c515a; }
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--sb) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--sb); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sb-hover); }
  /* The panes take whatever height the header leaves, so the page itself
     never scrolls. */
  body { margin:0; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh;
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  /* The wordmark is the mark doing duty as the O, with psis outlined to a
     path so the header needs no webfont. Its baseline sits 34 of 114 units
     above the box, which is what vertical-align puts back on the line. */
  h1 { margin:0; font-size:15px; line-height:1; }
  h1 .logo { display:inline-block; height:18px; width:auto; vertical-align:-5.4px; }
  #status { color:var(--muted); font-size:12px; }
  #q { margin-left:auto; padding:6px 10px; border:1px solid var(--line);
       border-radius:6px; background:var(--panel); color:var(--ink); min-width:220px; }
  main { display:grid; grid-template-columns:auto 1fr 1.2fr; gap:0; flex:1; min-height:0; }
  section { overflow:auto; padding:12px 14px; border-right:1px solid var(--line); }
  /* Drag the bottom-right corner of the first column to widen it. */
  #facets { width:280px; min-width:170px; max-width:60vw; resize:horizontal; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--muted); margin:14px 0 6px; font-weight:600; }
  h2:first-child { margin-top:0; }
  /* The Entities heading is the result table's header row: the date control
     sits above the date column, at the same inset as a row's own padding. */
  #results h2 { display:flex; justify-content:space-between; align-items:baseline;
                gap:10px; padding:0 6px; }
  .facet { display:flex; justify-content:space-between; gap:8px; padding:4px 6px;
           border-radius:4px; cursor:pointer; align-items:baseline; }
  .facet:hover { background:var(--chip); }
  .facet.on { background:var(--accent); color:var(--on-accent); }
  .facet .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .facet.on .n { color:var(--on-accent); opacity:.8; }
  .facet .ns { color:var(--muted); font-size:11px; margin-left:5px; }
  .facet.on .ns { color:var(--on-accent); opacity:.75; }
  /* Pinned classes head the Class list, in the viewer's order, above a rule
     that carries the way back to the store's pins. The pin shows on hover, and
     stays faint on the pinned. */
  .facet .r { display:flex; gap:6px; align-items:baseline; }
  button.pin { border:0; background:none; padding:0; cursor:pointer; color:inherit;

  .facet:hover button.pin, button.pin:focus-visible { opacity:.7; }
  .facet.pinned button.pin { opacity:.45; }
  button.pin:hover { opacity:1 !important; }
  .facet.pinned { cursor:grab; }
  .facet.zero { opacity:.55; }
  .facet.dragging { opacity:.4; }
  .facet.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
  .facet.drop-after { box-shadow:inset 0 -2px 0 var(--accent); }

  table { width:100%; border-collapse:collapse; }

  #catlink { font-size:12px; border:0; background:none; color:var(--accent);
             cursor:pointer; padding:0; text-transform:none; letter-spacing:normal;
             font-family:inherit; }

  /* A blank-node value (a class partition, say) is shown inline as its own

  .kv .k { color:var(--muted); font-size:12px; margin-right:3px; }
  .sep { color:var(--muted); }
  a.lst { font-size:11px; margin-left:4px; padding:0 4px; border:1px solid var(--line);

  /* Follow the IRI itself, where it resolves. Muted until hovered, so a list

  a.ext { color:var(--muted); text-decoration:none; font-size:11px; }
  a.ext:hover { color:var(--accent); }
  /* Copy the full IRI, whatever prefix the page shortened it to. */
  button.copy { border:0; background:none; padding:0 2px; margin-left:3px; cursor:pointer;

  button.copy:hover, button.copy.done { color:var(--accent); }
  /* Hand the resource to an application, per the settings' dereference rules.
     Named rather than an arrow, because which application it goes to is the
     thing worth seeing before clicking. */
  a.app { color:var(--muted); text-decoration:none; font-size:11px; margin-left:4px;
          padding:0 4px; border:1px solid var(--line); border-radius:3px; }
  a.app:hover { color:var(--accent); border-color:var(--accent); }
  /* A value whose rule hands it to an application: the value is the link. */
  a.opens { color:var(--accent); text-decoration:none; }
  a.opens:hover { text-decoration:underline; }
  /* Only shown once the store names more than the one service it was reached
     through, so the ordinary single-endpoint case keeps an uncluttered header. */
  /* Stacked panes, after Andy Matuschak's notes: each entity opens in a pane
     of fixed width beside the one it was opened from, and panes scrolled past
     stay at the left edge as narrow spines. Off, the strip dissolves into the
     ordinary three columns. */
  #strip, #detail.stack { display:contents; }
  /* The repository, at the far right of the header, as in nodica. */
  #gh-link { display:flex; align-self:center; color:var(--ink); opacity:.7; }
  #gh-link:hover { opacity:1; }
  #panes { font:inherit; font-size:12px; border:1px solid var(--line); border-radius:3px;
           background:none; color:var(--muted); cursor:pointer; padding:0 6px; }
  #panes[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); }
  body.stacked main { grid-template-columns:auto 1fr; }
  body.stacked #strip { display:flex; overflow-x:auto; overflow-y:hidden;
                        position:relative; min-width:0; height:100%; }
  body.stacked #results, body.stacked .pane {
    position:sticky; flex:0 0 var(--pane-w); width:var(--pane-w); height:100%;
    overflow:auto; background:var(--bg); padding:12px 14px;
    border-right:1px solid var(--line); box-shadow:-6px 0 10px -8px rgba(0,0,0,.4); }
  body.stacked #results { left:0; box-shadow:none; }
  .spine { display:none; }
  body.stacked .pane.covered > .body,
  body.stacked #results.covered > * { visibility:hidden; }
  /* A covered pane stops scrolling, and its spine sits at the scroll offset it
     was covered at (--st), so a pane read halfway down keeps its spine in view. */
  body.stacked .pane.covered, body.stacked #results.covered { overflow:hidden; }
  body.stacked .pane.covered > .spine, body.stacked #results.covered::before {
    display:block; position:absolute; top:var(--st, 0px); left:0; height:100%; width:var(--spine);
    cursor:pointer; writing-mode:vertical-rl; padding:14px 0 0 10px;
    font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; }
  body.stacked #results.covered::before { content:'Entities'; }
  .spine:hover, body.stacked #results.covered:hover::before { color:var(--accent); }
  body.stacked .pane.here { box-shadow:-6px 0 10px -8px rgba(0,0,0,.4), inset 3px 0 0 var(--accent); }
  #ep { font: inherit; font-size:12px; color:var(--ink); background:var(--panel);
        border:1px solid var(--line); border-radius:3px; padding:1px 4px; max-width:22em; }

<script>
// Which endpoint to read through. The URL wins, so a link can always pin one;
// otherwise the last choice made in the picker, remembered per browser; failing
// both, the local store. The page cannot ask the graph where the graph is, so
// this one setting has to bootstrap outside it - unlike the open rules, which
// the endpoint itself serves once there is an endpoint to ask.
const REMEMBERED = 'opsis-endpoint';
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const recall = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const forget = k => { try { localStorage.removeItem(k); } catch (e) {} };
const ENDPOINT = new URLSearchParams(location.search).get('endpoint')
  || recall(REMEMBERED)
  || 'http://localhost:7878/query';
const PAGE = 200;
const FACT_CAP = 300;    // facts shown for one entity
const LINK_CAP = 200;    // incoming links shown
const state = {cls: null, graph: null, text: '', offset: 0, sort: null};
// The catalogue node and the authority both come from the store: whichever
// dcat:Catalog it holds, and that node's own origin. A store with no catalogue
// hides the button and treats every http(s) IRI as followable. Hard-coding
// either would have made this page one graph's page.
let CATALOGUE = null;
let AUTHORITY = null;

// An entity's date is its earliest xsd:date/xsd:dateTime value, whatever
// property carries it (dcterms:issued, schema:startDate, anything else) -
// generic, no vocabulary list to maintain.
const DATE_FILTER = `FILTER(datatype(?d) = <http://www.w3.org/2001/XMLSchema#date>
                  || datatype(?d) = <http://www.w3.org/2001/XMLSchema#dateTime>)`;

// The endpoint's search sidecar, when it has one: ranked results in
// milliseconds, labels first. The contract: GET /search?q=<text>&limit=<n> on
// the endpoint's origin, answering {total, results: [{iri, label}]}. Detected once; without it, search falls back to
// a SPARQL CONTAINS over every literal - slower, and unranked.
let searchApi = null;        // URL or false once probed
let searchHits = null;       // sidecar results for the current search term
let searchTotal = 0;

// `?search=sparql` forces the CONTAINS path. Without it the fallback is
// unreachable wherever the sidecar answers, so nothing would ever exercise the
// fallback, and the two could not be compared against one store.
const FORCE_SPARQL =
  new URLSearchParams(location.search).get('search') === 'sparql';

async function probeSearchApi() {
  if (FORCE_SPARQL) { searchApi = false; return; }
  if (searchApi !== null) return;
  try {
    const u = new URL(ENDPOINT);
    const candidate = `${u.origin}/search`;
    // A website may answer /search with its own HTML page, as
    // data.nobelprize.org does, so only the sidecar's JSON shape counts.
    const r = await fetch(`${candidate}?q=&limit=1`);
    const j = r.ok ? await r.json() : null;
    searchApi = j && Array.isArray(j.results) && typeof j.total === 'number' ? candidate : false;
  } catch (e) { searchApi = false; }
}

const SEARCH_CAP = 2000;

// Every load takes a ticket, and only the latest ticket of its kind may write
// to the page. Without it a slow answer for "coh" could land after the answer
// for "cohesion" and replace it.
const turns = {};
const take = kind => {
  const n = turns[kind] = (turns[kind] || 0) + 1;
  return () => turns[kind] === n;
};
const fail = e => {
  document.getElementById('status').textContent = `endpoint error: ${e.message}`;
};

// Returns false when a newer search has started, so the caller drops its hits.
async function ensureSearch() {
  if (!state.text || searchApi === false) { searchHits = null; searchTotal = 0; return true; }
  const text = state.text;
  await probeSearchApi();
  if (!searchApi) { searchHits = null; return true; }
  const r = await fetch(`${searchApi}?q=${encodeURIComponent(text)}&limit=${SEARCH_CAP}`);
  const j = await r.json();
  if (text !== state.text) return false;
  searchHits = j.results;
  searchTotal = j.total;
  return true;
}

function textClause() {
  if (!state.text) return '';
  if (searchHits) return `VALUES ?s { ${searchHits.map(h => `<${h.iri}>`).join(' ')} }`;
  const t = state.text.replace(/["\\]/g, '\\$&');
  return `?s ?sfP ?sfV . FILTER(isLiteral(?sfV) && CONTAINS(LCASE(STR(?sfV)), LCASE("${t}")))`;
}

// Display prefixes. Vocabularies that declare their own prefix are read from
// the endpoint at load (loadPrefixes), and the catalogue's authority gets the
// empty prefix (loadCatalogue); these are the standard namespaces data rarely
// declares.
const PREFIXES = {
  'http://www.w3.org/1999/02/22-rdf-syntax-ns#': 'rdf:',
  'http://www.w3.org/2000/01/rdf-schema#': 'rdfs:',
  'http://www.w3.org/2002/07/owl#': 'owl:',
  'http://www.w3.org/2001/XMLSchema#': 'xsd:',
  'http://www.w3.org/2004/02/skos/core#': 'skos:',

// flag on the attempt rather than on the result left the page connected and

// itself the way any catalogue would. The picker stays hidden while the store

// viewer's own pins live in this browser, one list per endpoint, and replace
// the store's list rather than adding to it, so unpinning a default needs no
// record of its own. The page never writes to the store: "copy as Turtle"
// hands the list over for the settings graph, and once the store serves the
// same list the browser's copy is dropped, so later edits to the store reach
// this viewer again.
const PINS = `opsis-pins ${ENDPOINT}`;

// copy is not the store's data, so anything that could close the IRI is refused.
const iriSafe = s => typeof s === 'string' && /^[a-z][a-z0-9+.-]*:[^\s<>"{}|^`\\]*$/i.test(s);

// in the store would interleave, so only the first is read.
async function loadPins() {
  try {
    const rows = await sparql(`PREFIX cfg: <https://kvistgaard.github.io/config#>
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      SELECT ?config ?list ?c (COUNT(?mid) AS ?pos) WHERE {
        ?config a cfg:Configuration ; cfg:pinnedClasses ?list .
        ?list rdf:rest* ?mid . ?mid rdf:rest* ?cell . ?cell rdf:first ?c .
      } GROUP BY ?config ?list ?cell ?c ORDER BY ?config ?list ?pos`);

}
// The browser's pins as Turtle, ready for the settings graph. A store with a

function pinsTurtle() {
  const items = pinned().map(c => `    <${c}>`).join('\n');
  const subject = storeConfig ? `<${storeConfig}>` : '[] a cfg:Configuration ;\n   ';
  return `@prefix cfg: <https://kvistgaard.github.io/config#> .\n\n` +
    `# Opsis pinned classes. Replaces any cfg:pinnedClasses the configuration has.\n` +

async function loadEndpoints() {
  const sel = document.getElementById('ep');

    const rows = await sparql(`PREFIX dcat: <http://www.w3.org/ns/dcat#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT DISTINCT ?url ?title WHERE {
        ?svc a dcat:DataService ; dcat:endpointURL ?url .
        OPTIONAL { ?svc dcterms:title ?title }
      } ORDER BY ?title`);
    const seen = new Map();
    for (const b of rows) seen.set(b.url.value, b.title ? b.title.value : b.url.value);
    if (!seen.has(ENDPOINT)) seen.set(ENDPOINT, ENDPOINT);
    if (seen.size < 2) { sel.hidden = true; return true; }
    sel.innerHTML = [...seen].map(([url, title]) =>
      `<option value="${esc(url)}"${url === ENDPOINT ? ' selected' : ''}
               title="${esc(url)}">${esc(title)}</option>`).join('');
    sel.hidden = false;
    return true;
  } catch (e) { sel.hidden = true; return false; }

async function loadPrefixes() {
  try {
    const rows = await sparql(`SELECT DISTINCT ?ns ?prefix WHERE {
      { ?o <http://purl.org/vocab/vann/preferredNamespaceUri> ?ns ;
           <http://purl.org/vocab/vann/preferredNamespacePrefix> ?prefix }
      UNION
      { ?d <http://www.w3.org/ns/shacl#declare> ?decl .
        ?decl <http://www.w3.org/ns/shacl#namespace> ?ns ;
              <http://www.w3.org/ns/shacl#prefix> ?prefix }
    }`);
    for (const b of rows) {
      const ns = String(b.ns.value), pfx = String(b.prefix.value);
      if (ns && pfx && !(ns in PREFIXES)) PREFIXES[ns] = pfx + ':';

const localName = u => {

};
// The namespace part of a shortened IRI: which vocabulary a facet belongs to,
// and what tells apart two facets sharing a label (owl:Class and rdfs:Class
// are both labelled "Class"). A namespace that declares no prefix falls back
// to the last segment of its IRI, and the authority's own to its host name;
// the full IRI is always in the hover.
const nsHint = u => {
  const s = short(u);

// form post also needs no CORS preflight.

// Filters are built once and shared by the facet counts and the result list, so

// every filter but its own: clicking one of its values replaces that filter,
// so the count beside the value is the length of the list the click opens.

  const out = [];
  if (state.cls && except !== 'cls') out.push(`?s a/rdfs:subClassOf* <${state.cls}> .`);
  if (state.graph && except !== 'graph') out.push(`GRAPH <${state.graph}> { ?s ?anyP ?anyO }`);

const PREFIX = 'PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n';

// several times the entities its list then showed.

// or more, most of them holding more than one entity. The Nobel Prize store

// in a graph of its own, 4,581 graphs of one entity each, which listed read
// as a column of numbers. The verdict is reached once, on the unfiltered
// store, so a section does not come and go as the user clicks, and a hidden

async function loadFacets(current) {

  const pins = pinned();
  const [classes, graphs, pinRows] = await Promise.all([
    !shown('cls') ? [] : sparql(`${PREFIX}SELECT ?c ?n (SAMPLE(?l) AS ?label) WHERE {
      { SELECT ?c (COUNT(DISTINCT ?s) AS ?n) WHERE {
          ${filters('cls')}

          FILTER(isIRI(?c) && isIRI(?s))

          VALUES ?c { ${pins.map(c => `<${c}>`).join(' ')} }

function renderFacets() {

  // from the list it was pinned from.
  const known = new Map([...classes, ...facetRows.pins].map(b => [b.c.value, b]));

  const rest = classes.filter(b => !pins.includes(b.c.value));

  // to reads off the list rather than out of the hover. Graph names share one
  // namespace, so there the hint appears only where two share a title.
  const render = (rows, iriOf, nameOf, key, always, isPinned = false) => {
    const seen = {};
    for (const b of rows) { const nm = nameOf(b); seen[nm] = (seen[nm] || 0) + 1; }
    return rows.map(b => {
      const v = iriOf(b), nm = nameOf(b), n = b.n ? b.n.value : '0';
      const hint = (always || seen[nm] > 1) ? `<span class="ns">· ${esc(nsHint(v))}</span>` : '';
      const pin = key !== 'cls' ? '' :
        `<button class="pin" data-pin="${esc(v)}" title="${isPinned ? 'Unpin' : 'Pin to the top'}"
                 aria-label="${isPinned ? 'Unpin' : 'Pin'} ${esc(nm)}">${PIN_ICON}</button>`;
      const cls = ['facet', state[key] === v ? 'on' : '', isPinned ? 'pinned' : '', n === '0' ? 'zero' : ''];
      return `<div class="${cls.join(' ').trim()}" data-key="${key}" data-v="${esc(v)}" title="${esc(v)}"${
                   isPinned ? ' draggable="true" tabindex="0"' : ''}>
                <span>${esc(nm)}${hint}</span><span class="r">${pin}<span class="n">${n}</span></span></div>`;
    }).join('');
  };
  const section = (key, title, body, show = shown(key)) => !show ? '' :
    `<h2>${title} ${state[key] ? `<button class="clear" data-clear="${key}">clear</button>` : ''}</h2>` + body;
  const clsName = b => b.label ? b.label.value : localName(b.c.value);
  const own = ownPins && !samePins(ownPins, storePins);
  const pinbar = !pins.length && !own ? '' : `<div class="pinbar">${own ?
    `<button class="clear" id="pincopy" title="Copy these pins as Turtle, for the store's settings">copy as Turtle</button>
     <button class="clear" id="pinreset" title="${storePins.length ? "Back to the store's pins" : 'Unpin all'}">reset</button>` : ''}</div>`;
  document.getElementById('facets').innerHTML =
    section('cls', 'Class',
      render(pinRows, b => b.c.value, clsName, 'cls', true, true) + pinbar +
      (shown('cls') ? render(rest, b => b.c.value, clsName, 'cls', true) : ''),
      shown('cls') || pins.length > 0) +
    section('graph', 'Graph',
      render(graphs, b => b.g.value, b => b.title ? b.title.value : localName(b.g.value), 'graph'));

function togglePin(iri) {
  const list = pinned();
  setPins(list.includes(iri) ? list.filter(c => c !== iri) : [...list, iri]);
  renderFacets();
}
// Put a pinned class before or after another; the list is saved as it stands.
function movePin(iri, target, after) {
  const list = pinned().filter(c => c !== iri);
  const at = list.indexOf(target);
  if (at < 0) return;
  list.splice(at + (after ? 1 : 0), 0, iri);
  setPins(list);
  renderFacets();

// own IRIs are the ones a personal graph typically does not serve, so an arrow
// there would promise a 404, and it is left off until the day it does serve.
// A file: locator opens only from a page that is itself on file:, which is how
// this one is normally opened, so the arrow appears where it works and nowhere

const isLocalFile = iri => iri.startsWith('file:');

// page is allowed. So the target attribute is the difference between a
// document that opens and one that silently does not. A binary the browser
// cannot render (.pptx, .epub) turns the click into a download and leaves this
// page where it was; a .pdf, .md or .html replaces it, and Back returns.
// Marked with a class the click handler lets through untouched, so following
// the link never also opens the entity pane behind it.
// Where a resource is opened, from the settings in the store: a
// cfg:dereferenceRule matches on cfg:uriPrefix and, optionally,
// cfg:fileExtension, and its cfg:template builds the address (nodica's
// vocabulary; settings.example.ttl shows the shape). The longest
// matching prefix wins and, between equal prefixes, the rule naming an

let openRules = [];

  try {
    const rows = await sparql(`PREFIX cfg: <https://kvistgaard.github.io/config#>

      SELECT ?prefix ?ext ?template ?label WHERE {
        ?config a cfg:Configuration ; cfg:dereferenceRule ?rule .
        ?rule cfg:template ?template .
        OPTIONAL { ?rule cfg:uriPrefix ?prefix }
        OPTIONAL { ?rule cfg:fileExtension ?ext }
        OPTIONAL { ?rule rdfs:label ?label }
      }`);

      prefix: b.prefix ? b.prefix.value : '',
      ext: b.ext ? b.ext.value.toLowerCase().replace(/^\./, '') : '',
      template: b.template.value,
      label: b.label ? b.label.value : 'open',
    })).sort((a, b) => b.prefix.length - a.prefix.length || (b.ext ? 1 : 0) - (a.ext ? 1 : 0));

  } catch (e) { openRules = []; return false; }

// A template resolving to one of these is never opened: they would execute in
// this page rather than address a resource outside it.
const BAD_SCHEME = /^(javascript|data|blob|vbscript):/i;
// The winning rule's address, placeholders filled. {RAW}, {URI} and {LOCAL}
// are nodica's; {PATH} and {PATHENC} exist because a desktop application is
// addressed by a path and not by a URI.
function appLink(iri) {
  for (const r of openRules) {
    if (r.prefix && !iri.startsWith(r.prefix)) continue;
    if (r.ext && !iri.split(/[?#]/)[0].toLowerCase().endsWith('.' + r.ext)) continue;
    let path = '', pathenc = '';
    if (isLocalFile(iri)) {
      // file:///C:/a/b.md -> C:/a/b.md, file:///home/a/b.md -> /home/a/b.md:
      // the slash before a drive letter belongs to the URI, not to the path.
      try {
        let rest = iri.replace(/^file:\/\/(localhost)?/i, '').split(/[?#]/)[0];
        if (/^\/[A-Za-z]:/.test(rest)) rest = rest.slice(1);
        path = decodeURIComponent(rest);
        pathenc = encodeURIComponent(path);
      } catch (e) { path = pathenc = ''; }
    }
    const url = r.template
      .split('{RAW}').join(iri)
      .split('{URI}').join(encodeURIComponent(iri))
      .split('{LOCAL}').join(r.prefix ? iri.slice(r.prefix.length) : iri)
      .split('{PATHENC}').join(pathenc)
      .split('{PATH}').join(path);
    if (BAD_SCHEME.test(url) || !/^[a-z][a-z0-9+.-]*:/i.test(url)) return null;
    return { url, label: r.label };
  }

}

// The arrow follows the IRI in the browser, in a new tab, so the page and its
// queries are still there afterwards. A file: URL opens in a tab the page
// opened as readily as any other - a target=_blank link from a file: page
// opens the file in a new tab - so nothing here
// needs the same-tab special case the earlier version carried.
// The named link stays beside a value that already opens the application: both
// go to the same place, and the name is what says where the click will land.
const followLink = iri => {
  const app = appLink(iri);
  const appHtml = app
    ? ` <a class="app" href="${esc(app.url)}"
             title="Open ${esc(iri)} in ${esc(app.label)}">${esc(app.label)}</a>`
    : '';
  if (!followable(iri)) return appHtml;
  return ` <a class="ext" href="${esc(iri)}" target="_blank" rel="noopener"
              title="Open ${esc(iri)} in a new tab">↗</a>` + appHtml;
};

const COPY_ICON = '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" fill="none" ' +

  '<path d="M10.5 3.5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1h.5"/></svg>';

  'stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h4M7 2v4.5L4.5 9.5h7L9 6.5V2M8 9.5V14"/></svg>';
const copyButton = iri =>
  `<button class="copy" data-copy="${esc(iri)}" title="Copy ${esc(iri)}" aria-label="Copy IRI">${COPY_ICON}</button>`;
// The clipboard API wants a secure context; where it refuses, the older
// selection copy still works.
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
}

const rowHtml = (iri, label, date) =>
  `<div class="row" data-iri="${esc(iri)}">
     <div class="r1"><span>${esc(label || short(iri))}</span>${
       date ? `<span class="d">${esc(date)}</span>` : ''}</div>
     <div class="t"><code>${esc(short(iri))}</code>${copyButton(iri)}${followLink(iri)}</div></div>`;

// Dates for just the visible page - one VALUES query over 200 subjects,
// so the default view never pays for a store-wide date scan.
async function attachDates(rows) {
  // An IRI carrying whitespace or angle brackets would break out of the
  // VALUES block; drop it rather than send a malformed query.
  const safe = rows.filter(r => /^[a-z][a-z0-9+.-]*:/i.test(r.iri) && !/[\s<>"{}|^`]/.test(r.iri));
  if (!safe.length) return;
  const dates = await sparql(`SELECT ?s (MIN(?d) AS ?date) WHERE {
    VALUES ?s { ${safe.map(r => `<${r.iri}>`).join(' ')} }
    ?s ?dp ?d . ${DATE_FILTER}
  } GROUP BY ?s`);
  const byIri = Object.fromEntries(dates.map(b => [b.s.value, b.date.value.slice(0, 10)]));
  for (const r of rows) r.date = byIri[r.iri];
}

async function loadResults(append, current) {
  let rows, total;
  // The sidecar returns at most SEARCH_CAP hits, and every path that uses them
  // - the ranked list, the facet counts, the joins - sees only those.
  const note = state.text && searchHits && searchTotal > searchHits.length
    ? `; search uses the first ${searchHits.length} of ${searchTotal} matches` : '';
  if (state.text && searchHits && !state.cls && !state.graph && !state.sort) {
    // Pure search: page the sidecar's ranked hits directly, label matches
    // first. SPARQL can rank the same way, at ~150ms a keystroke plus a
    // second scan for the total; the sidecar does both at once.
    rows = searchHits.slice(state.offset, state.offset + PAGE)
                     .map(h => ({ iri: h.iri, label: h.label }));
    total = searchHits.length;
    await attachDates(rows);
  } else if (!state.sort) {
    // The page is chosen by IRI first and labelled after, so an entity with
    // two labels takes one row rather than two.
    const where = whereWith();
    const [countRows, pageRows] = await Promise.all([
      append ? Promise.resolve(null)
             : sparql(`${PREFIX}SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ${where} }`),
      sparql(`${PREFIX}SELECT ?s (SAMPLE(?l) AS ?label) WHERE {
        { SELECT DISTINCT ?s WHERE { ${where} } ORDER BY ?s LIMIT ${PAGE} OFFSET ${state.offset} }
        OPTIONAL { ?s rdfs:label ?l }
      } GROUP BY ?s ORDER BY ?s`),
    ]);
    if (!current()) return;
    if (countRows) state.total = parseInt(countRows[0].n.value, 10);
    total = state.total;
    rows = pageRows.map(b => ({ iri: b.s.value, label: b.label ? b.label.value : null }));
    await attachDates(rows);
  } else {
    // Date sort: the order must exist before LIMIT/OFFSET, so this is the one
    // path that scans every matching entity for its earliest date (~500 ms
    // store-wide). Undated entities sink to the end under either direction.
    const where = whereWith();
    const order = `DESC(BOUND(?date)) ${state.sort === 'asc' ? 'ASC' : 'DESC'}(?date) ?s`;
    const [countRows, pageRows] = await Promise.all([
      append ? Promise.resolve(null)
             : sparql(`${PREFIX}SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ${where} }`),
      sparql(`${PREFIX}SELECT ?s ?date (SAMPLE(?l) AS ?label) WHERE {
        { SELECT ?s (MIN(?d) AS ?date) WHERE {
            ${where}
            OPTIONAL { ?s ?dp ?d . ${DATE_FILTER} }
          } GROUP BY ?s
          ORDER BY ${order} LIMIT ${PAGE} OFFSET ${state.offset} }
        OPTIONAL { ?s rdfs:label ?l }
      } GROUP BY ?s ?date ORDER BY ${order}`),
    ]);
    if (!current()) return;
    if (countRows) state.total = parseInt(countRows[0].n.value, 10);
    total = state.total;
    rows = pageRows.map(b => ({ iri: b.s.value,
                                label: b.label ? b.label.value : null,
                                date: b.date ? b.date.value.slice(0, 10) : null }));
  }
  if (!current()) return;
  const shown = state.offset + rows.length;
  const glyph = state.sort === 'desc' ? '▼' : state.sort === 'asc' ? '▲' : '⇅';
  const header = `<h2><span>Entities (${total ? `showing 1–${shown} of ${total}` : '0'}${note})</span>
    <button class="clear" id="sortd" title="Sort by date: newest first / oldest first / off">date ${glyph}</button></h2>`;
  const body = rows.map(r => rowHtml(r.iri, r.label, r.date)).join('');
  const more = shown < total
    ? `<div class="row" id="more" style="color:var(--accent)">Load ${Math.min(PAGE, total - shown)} more…</div>` : '';
  const el = document.getElementById('results');
  if (append) {
    document.getElementById('more')?.remove();
    el.querySelector('h2').outerHTML = header;
    el.insertAdjacentHTML('beforeend', body + more);
  } else {
    el.innerHTML = header +
      (rows.length ? body + more
        : '<p style="color:var(--muted)">Nothing matches these facets.</p>');
  }
}

async function loadDetail(iri, pane) {
  // A blank-node value cannot be opened, so its own facts are fetched by a
  // second query and render inline: a dataset's class partition reads as
  // "class ResearchNote · instance count 23", with a link to list them. A
  // separate query rather than an OPTIONAL with a FILTER on the outer value:
  // Oxigraph evaluates that by materialising every triple first, and gave no
  // answer in two minutes where the two queries below take a fraction of a second.
  // Each list asks for one row past its cap, which is how the pane knows to
  // say it stopped short.
  const [factRows, nestedRows, incomingRows] = await Promise.all([
    sparql(`${PREFIX}SELECT ?p ?o ?g (SAMPLE(?pl) AS ?plabel) (SAMPLE(?ol) AS ?olabel) WHERE {
      GRAPH ?g { <${iri}> ?p ?o }
      OPTIONAL { ?p rdfs:label ?pl }
      OPTIONAL { ?o rdfs:label ?ol }
    } GROUP BY ?p ?o ?g ORDER BY ?p LIMIT ${FACT_CAP + 1}`),
    sparql(`${PREFIX}SELECT ?p ?b ?g ?p2 ?o2 (SAMPLE(?p2l) AS ?p2label) (SAMPLE(?o2l) AS ?o2label) WHERE {
      GRAPH ?g { <${iri}> ?p ?b . ?b ?p2 ?o2 . FILTER(isBlank(?b)) }
      OPTIONAL { ?p2 rdfs:label ?p2l }
      OPTIONAL { ?o2 rdfs:label ?o2l }
    } GROUP BY ?p ?b ?g ?p2 ?o2 ORDER BY ?p ?b ?p2 LIMIT 300`),
    sparql(`${PREFIX}SELECT ?s ?p ?g (SAMPLE(?sl) AS ?slabel) (SAMPLE(?pl) AS ?plabel) WHERE {
      GRAPH ?g { ?s ?p <${iri}> }
      OPTIONAL { ?s rdfs:label ?sl }
      OPTIONAL { ?p rdfs:label ?pl }
    } GROUP BY ?s ?p ?g ORDER BY ?p LIMIT ${LINK_CAP + 1}`),
  ]);
  // A pane closed or replaced while its queries ran is no longer on the page.
  if (!pane.isConnected) return;
  const facts = factRows.slice(0, FACT_CAP);
  const incoming = incomingRows.slice(0, LINK_CAP);
  const moreFacts = factRows.length > FACT_CAP;
  const moreLinks = incomingRows.length > LINK_CAP;
  // Fold each blank node's facts into its row. Matched by the blank node's
  // label when the endpoint keeps labels stable across queries (Oxigraph
  // does), otherwise by position under the same property.
  const nestedGroups = new Map();
  for (const r of nestedRows) {
    const key = `${r.p.value}|${r.g.value}|${r.b.value}`;
    if (!nestedGroups.has(key)) nestedGroups.set(key, []);
    nestedGroups.get(key).push(r);
  }
  const seenUnder = {};
  for (const row of facts) {
    row.inner = [];
    if (row.o.type !== 'bnode') continue;
    const under = `${row.p.value}|${row.g.value}`;
    const exact = nestedGroups.get(`${under}|${row.o.value}`);
    if (exact) { row.inner = exact; continue; }
    const groups = [...nestedGroups.entries()].filter(([k]) => k.startsWith(under + '|')).map(([, v]) => v);
    const n = seenUnder[under] = (seenUnder[under] || 0) + 1;
    row.inner = groups[n - 1] || [];
  }
  // Properties and linked resources read by their labels, exactly as the class
  // facets do; the IRI is one hover away.
  const propCell = r =>
    `<td class="p" title="${esc(r.p.value)}">${esc(r.plabel ? r.plabel.value : localName(r.p.value))}</td>`;
  // Where a rule hands the resource to an application, the value itself is that
  // link: opening a note means clicking the note, not finding a second small
  // link beside it. What is given up is the node page for that IRI, which for a
  // file: locator is no loss - a file path locates a resource, it does not
  // identify one.
  // Everything with no rule keeps the graph link it had.
  const iriLink = (v, label) => {
    const app = appLink(v);
    if (app) {
      return `<a class="opens" href="${esc(app.url)}"
                 title="Open in ${esc(app.label)}: ${esc(v)}">${esc(label || short(v))}</a>`
        + followLink(v);
    }
    return `<a href="#" data-iri="${esc(v)}" title="${esc(v)}">${esc(label || short(v))}</a>`
      + followLink(v);
  };
  const innerHtml = rows => rows.map(r => {
    const k = esc(r.p2label ? r.p2label.value : localName(r.p2.value));
    let v = r.o2.type === 'uri' ? iriLink(r.o2.value, r.o2label && r.o2label.value) : esc(r.o2.value);
    if (r.p2.value === 'http://rdfs.org/ns/void#class' && r.o2.type === 'uri')
      v += `<a href="#" class="lst" data-cls="${esc(r.o2.value)}" title="List every entity of this class">list</a>`;
    return `<span class="kv"><span class="k">${k}</span>${v}</span>`;
  }).join('<span class="sep"> · </span>');
  const objCell = r => r.o.type === 'uri'
    ? iriLink(r.o.value, r.olabel && r.olabel.value)
    : r.o.type === 'bnode'
      ? (r.inner.length ? innerHtml(r.inner) : '<span class="t">[blank node]</span>')
      : esc(r.o.value);
  const labelRow = facts.find(r => r.p.value === 'http://www.w3.org/2000/01/rdf-schema#label');
  const heading = labelRow ? labelRow.o.value : localName(iri);
  pane.querySelector('.spine').textContent = heading;
  pane.querySelector('.body').innerHTML =
    `<h2>Entity</h2>` +
    `<p class="ehead">${esc(heading)}</p>` +
    `<p><code title="${esc(iri)}">${esc(short(iri))}</code>${copyButton(iri)}${followLink(iri)}</p>` +
    `<p class="t">${moreFacts ? `the first ${FACT_CAP}` : facts.length} facts across ` +
    `${new Set(facts.map(r => r.g.value)).size} graph(s)` +
    (incoming.length ? `; linked from ${moreLinks ? `more than ${LINK_CAP}` : incoming.length} place(s)` : '') +
    (moreFacts || moreLinks ? '; the rest are not shown' : '') + `</p>` +
    `<table>` + facts.map(r =>
      `<tr>${propCell(r)}<td>${objCell(r)}
        <div class="t" style="font-size:11px" title="${esc(r.g.value)}">${esc(localName(r.g.value))}</div></td></tr>`).join('') +
    `</table>` +
    (incoming.length ? `<h2>Linked from</h2><table>` + incoming.map(r =>
      `<tr><td class="p" title="${esc(r.p.value)}">${esc(r.plabel ? r.plabel.value : localName(r.p.value))}</td>
        <td>${r.s.type === 'bnode'
          // A blank node has no IRI to open a pane on, so it is named, not linked.
          ? '<span class="t">[blank node]</span>'
          : `<a href="#" data-iri="${esc(r.s.value)}" title="${esc(r.s.value)}">${esc(r.slabel ? r.slabel.value : short(r.s.value))}</a>${followLink(r.s.value)}`}
        <div class="t" style="font-size:11px" title="${esc(r.g.value)}">${esc(localName(r.g.value))}</div></td></tr>`).join('') +
      `</table>` : '');
}

async function refresh() {
  const s = document.getElementById('status');
  const current = take('refresh');
  try {
    s.textContent = 'querying…';
    partial = false;
    state.offset = 0;
    await loadSettings();
    if (!await ensureSearch() || !current()) return;
    await Promise.all([loadFacets(take('facets')), loadResults(false, take('results'))]);
    if (!current()) return;
    const scan = searchApi === false && state.text
      ? (FORCE_SPARQL ? ' (forced SPARQL scan)' : ' (no search sidecar; SPARQL scan)')
      : '';
    const cut = partial ? ' – the endpoint cut some answers short; counts may be incomplete' : '';
    s.textContent = `connected to ${ENDPOINT}${scan}${cut}`;
  } catch (e) {
    if (current()) fail(e);
  }
}

document.addEventListener('click', e => {
  // An external link is the browser's business: no preventDefault, and no
  // walking on to the data-iri handler that would open the entity pane too.
  if (e.target.closest('a.ext, a.app, a.opens')) return;
  // Copying never opens the row the button sits in.
  const copy = e.target.closest('button.copy');
  if (copy) {
    copyText(copy.dataset.copy).then(() => {
      copy.classList.add('done');
      copy.textContent = '✓';
      setTimeout(() => { copy.classList.remove('done'); copy.innerHTML = COPY_ICON; }, 1200);
    });
    return;
  }
  if (e.target.id === 'more') {
    state.offset += PAGE;
    loadResults(true, take('results')).catch(fail);
    return;
  }
  if (e.target.id === 'sortd') {
    state.sort = state.sort === 'desc' ? 'asc' : state.sort === 'asc' ? null : 'desc';
    state.offset = 0;
    loadResults(false, take('results')).catch(fail);
    return;
  }
  const clear = e.target.closest('[data-clear]');
  if (clear) { state[clear.dataset.clear] = null; refresh(); return; }
  if (e.target.id === 'catlink') { if (CATALOGUE) openEntity(CATALOGUE, null); return; }
  if (e.target.id === 'panes') { setStacked(!stacked); return; }
  const spine = e.target.closest('.spine');
  if (spine) { reveal(spine.parentElement); return; }
  // The list's spine is drawn by CSS, and its hidden rows take no clicks, so a
  // click on it lands on the list itself.
  if (e.target === results && results.classList.contains('covered')) {
    strip.scrollTo({ left: 0, behavior: 'smooth' });
    return;
  }
  // "list" beside a class partition: the menu opens on that dish.
  const cls = e.target.closest('[data-cls]');
  if (cls) {
    e.preventDefault();
    state.cls = cls.dataset.cls; state.graph = null; state.text = ''; state.sort = null;
    document.getElementById('q').value = '';
    refresh();
    return;
  }
  const pin = e.target.closest('button.pin');
  if (pin) { togglePin(pin.dataset.pin); return; }
  if (e.target.id === 'pinreset') { resetPins(); renderFacets(); return; }
  if (e.target.id === 'pincopy') {
    const b = e.target;
    copyText(pinsTurtle()).then(() => {
      b.textContent = 'copied';
      setTimeout(() => { b.textContent = 'copy as Turtle'; }, 1200);
    });
    return;
  }
  const f = e.target.closest('.facet');
  if (f) { state[f.dataset.key] = state[f.dataset.key] === f.dataset.v ? null : f.dataset.v;
           refresh(); return; }
  const link = e.target.closest('[data-iri]');
  if (link) { e.preventDefault(); openEntity(link.dataset.iri, link.closest('.pane')); }
});
// Switching endpoint reloads rather than re-querying in place: prefixes, open
// rules, the search sidecar and every count belong to the store just left, and
// a reload is the one way to be sure none of them survives the move. The choice
// goes into the URL as well as into storage, so the address bar keeps saying
// which store is on screen and the link can be handed to someone else.
document.getElementById('ep').addEventListener('change', e => {
  const url = e.target.value;
  remember(REMEMBERED, url);
  const params = new URLSearchParams(location.search);
  params.set('endpoint', url);
  location.search = params.toString();
});
// Pinned classes reorder by dragging, or with Alt+↑ and Alt+↓ on a focused one.
const facetsEl = document.getElementById('facets');
let dragged = null;
const dropMarks = () => facetsEl.querySelectorAll('.drop-before, .drop-after')
  .forEach(x => x.classList.remove('drop-before', 'drop-after'));
facetsEl.addEventListener('dragstart', e => {
  const f = e.target.closest('.facet.pinned');
  if (!f) return;
  dragged = f.dataset.v;
  f.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragged);   // Firefox starts no drag without data
});
facetsEl.addEventListener('dragover', e => {
  const f = e.target.closest('.facet.pinned');
  if (!dragged || !f) return;
  e.preventDefault();
  const r = f.getBoundingClientRect();
  dropMarks();
  if (f.dataset.v !== dragged)
    f.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
});
facetsEl.addEventListener('drop', e => {
  const f = e.target.closest('.facet.pinned');
  if (!dragged || !f) return;
  e.preventDefault();
  if (f.dataset.v !== dragged) movePin(dragged, f.dataset.v, f.classList.contains('drop-after'));
});
facetsEl.addEventListener('dragend', () => { dragged = null; renderFacets(); });
facetsEl.addEventListener('keydown', e => {
  const f = e.target.closest('.facet.pinned');
  if (!f || e.target !== f) return;
  if (e.key === 'Enter') { f.click(); return; }
  if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const list = pinned(), v = f.dataset.v, i = list.indexOf(v);
  const j = i + (e.key === 'ArrowUp' ? -1 : 1);
  if (j < 0 || j >= list.length) return;
  movePin(v, list[j], e.key === 'ArrowDown');
  [...facetsEl.querySelectorAll('.facet.pinned')].find(x => x.dataset.v === v)?.focus();
});

let timer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.text = e.target.value.trim(); refresh(); }, 300);
});
// The panes. Single, a new entity replaces the one pane there is. Stacked, an
// entity opened from pane k replaces everything right of k, as in Matuschak's
// notes, and one opened from the list, the facets or the header starts a new
// stack. An entity already open is scrolled to rather than opened twice. Each
// pane runs its own queries once, when it opens; closing panes is only DOM
// removal, so walking back and forth costs nothing.
const PANES = 'opsis-panes';
const detail = document.getElementById('detail');
const strip = document.getElementById('strip');
const results = document.getElementById('results');
let stacked = (new URLSearchParams(location.search).get('panes') || recall(PANES)) === 'stacked';
const panes = () => [...detail.querySelectorAll('.pane[data-iri]')];

function newPane(iri) {
  const p = document.createElement('div');
  p.className = 'pane';
  p.dataset.iri = iri;
  p.innerHTML = `<div class="spine" title="${esc(iri)}">${esc(short(iri))}</div>` +
    `<div class="body"><h2>Entity</h2><p class="t">loading…</p></div>`;
  return p;
}

function openEntity(iri, from) {
  detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
  const open = panes();
  if (stacked) {
    const already = open.find(p => p.dataset.iri === iri);
    if (already) { reveal(already); return; }
    const k = from ? open.indexOf(from) : -1;
    open.slice(k + 1).forEach(p => p.remove());
  } else {
    detail.replaceChildren();
  }
  const p = newPane(iri);
  detail.append(p);
  loadDetail(iri, p).catch(fail);
  layout();
  reveal(p);
  syncUrl();
}

// A pane's sticky offset is its place in the stack times the spine width, so
// every pane scrolled past stays behind as a spine of its own.
function layout() {
  panes().forEach((p, i) => { p.style.left = stacked ? `calc(${i + 1} * var(--spine))` : ''; });
  cover();
}
function reveal(p) {
  panes().forEach(q => q.classList.toggle('here', stacked && q === p));
  if (!stacked) return;
  // A sticky pane reports where it is stuck, not where it sits in the row, so
  // its place is summed from the widths before it.
  const before = panes().slice(0, panes().indexOf(p));
  const at = before.reduce((x, q) => x + q.offsetWidth, results.offsetWidth);
  const spine = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spine')) || 36;
  strip.scrollTo({ left: Math.max(0, at - (before.length + 1) * spine), behavior: 'smooth' });
}
// A pane is covered once the next one has slid over most of it; it then
// shows its title on the spine instead of a sliver of its content.
function cover() {
  const all = [results, ...panes()];
  all.forEach((p, i) => {
    const next = all[i + 1];
    const covered = stacked && !!next &&
      next.getBoundingClientRect().left - p.getBoundingClientRect().left < p.offsetWidth / 2;
    if (covered && !p.classList.contains('covered')) p.style.setProperty('--st', `${p.scrollTop}px`);
    p.classList.toggle('covered', covered);
  });
}
let coverFrame = 0;
const coverSoon = () => { cancelAnimationFrame(coverFrame); coverFrame = requestAnimationFrame(cover); };
strip.addEventListener('scroll', coverSoon, { passive: true });
addEventListener('resize', coverSoon);

function setStacked(on) {
  stacked = on;
  remember(PANES, on ? 'stacked' : 'single');
  document.body.classList.toggle('stacked', on);
  detail.classList.toggle('stack', on);
  document.getElementById('panes').setAttribute('aria-pressed', String(on));
  if (!on) panes().slice(0, -1).forEach(p => p.remove());
  layout();
  syncUrl();
}

// The open panes live in the URL, so a stack can be bookmarked or handed on.
function syncUrl() {
  const params = new URLSearchParams(location.search);
  params.delete('open');
  for (const p of panes()) params.append('open', p.dataset.iri);
  if (stacked) params.set('panes', 'stacked');
  else params.delete('panes');
  const q = params.toString();
  history.replaceState(null, '', q ? `?${q}` : location.pathname);
}

const reopen = new URLSearchParams(location.search).getAll('open');
setStacked(stacked);
refresh().then(() => {
  let from = null;
  for (const iri of stacked ? reopen : reopen.slice(-1)) {
    openEntity(iri, from);
    from = panes().at(-1);
  }
});
</script>
</body>
</html>
