<script>
const REMEMBERED = 'opsis-endpoint';
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const recall = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const forget = k => { try { localStorage.removeItem(k); } catch (e) {} };
const ENDPOINT = new URLSearchParams(location.search).get('endpoint')
  || recall(REMEMBERED)
  || 'http://localhost:7878/query';
const PAGE = 200;
const FACT_CAP = 300;
const LINK_CAP = 200;
const state = {cls: null, graph: null, text: '', offset: 0, sort: null};
let CATALOGUE = null;
let AUTHORITY = null;

const DATE_FILTER = `FILTER(datatype(?d) = <http://www.w3.org/2001/XMLSchema#date>
                  || datatype(?d) = <http://www.w3.org/2001/XMLSchema#dateTime>)`;

let searchApi = null;
let searchHits = null;
let searchTotal = 0;

const FORCE_SPARQL =
  new URLSearchParams(location.search).get('search') === 'sparql';

const NO_DATES = new URLSearchParams(location.search).get('dates') === 'off';

const GIVEN_GRAPHS = (new URLSearchParams(location.search).get('graphs') || '')
  .split(/\s+/).filter(g => /^[a-z][a-z0-9+.-]*:/i.test(g) && !/[\s<>"{}|^`\\]/.test(g));
const graphList = GIVEN_GRAPHS.map(g => `<${g}>`).join(' ');
const inGiven = (v, pattern) => `VALUES ?${v} { ${graphList} }\n  GRAPH ?${v} { ${pattern} }`;
const GRAPH_VALUES = GIVEN_GRAPHS.length ? `VALUES ?g { ${graphList} }\n  ` : '';
document.getElementById('voidcopy').hidden = !GIVEN_GRAPHS.length;

async function probeSearchApi() {
  if (FORCE_SPARQL) { searchApi = false; return; }
  if (searchApi !== null) return;
  try {
    const u = new URL(ENDPOINT);
    const candidate = `${u.origin}/search`;

function appLink(iri) {

    if (r.ext && !iri.split(/[?#]/)[0].toLowerCase().endsWith('.' + r.ext)) continue;
    let path = '', pathenc = '';
    if (isLocalFile(iri)) {
      try {
        let rest = iri.replace(/^file:\/\/(localhost)?/i, '').split(/[?#]/)[0];
        if (/^\/[A-Za-z]:/.test(rest)) rest = rest.slice(1);
        path = decodeURIComponent(rest);
        pathenc = encodeURIComponent(path);
      } catch (e) { path = pathenc = ''; }

    const url = r.template
      .split('{RAW}').join(iri)
      .split('{URI}').join(encodeURIComponent(iri))
      .split('{LOCAL}').join(r.prefix ? iri.slice(r.prefix.length) : iri)
      .split('{PATHENC}').join(pathenc)
      .split('{PATH}').join(path);
    if (BAD_SCHEME.test(url) || !/^[a-z][a-z0-9+.-]*:/i.test(url)) return null;
    return { url, label: r.label };

  'stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h4M7 2v4.5L4.5 9.5h7L9 6.5V2M8 9.5V14"/></svg>';
const copyButton = iri =>
  `<button class="copy" data-copy="${esc(iri)}" title="Copy ${esc(iri)}" aria-label="Copy IRI">${COPY_ICON}</button>`;
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
}

const rowHtml = (iri, label, date) =>
  `<div class="row" data-iri="${esc(iri)}">
     <div class="r1"><span>${esc(label || short(iri))}</span>${
       date ? `<span class="d">${esc(date)}</span>` : ''}</div>
     <div class="t"><code>${esc(short(iri))}</code>${copyButton(iri)}${followLink(iri)}</div></div>`;

async function attachDates(rows) {
  if (NO_DATES) return;
  const safe = rows.filter(r => /^[a-z][a-z0-9+.-]*:/i.test(r.iri) && !/[\s<>"{}|^`]/.test(r.iri));
  if (!safe.length) return;
  const dates = await sparql(`SELECT ?s (MIN(?d) AS ?date) WHERE {
    VALUES ?s { ${safe.map(r => `<${r.iri}>`).join(' ')} }
    ${GIVEN_GRAPHS.length ? inGiven('gDate', '?s ?dp ?d') : '?s ?dp ?d .'} ${DATE_FILTER}
  } GROUP BY ?s`);
  const byIri = Object.fromEntries(dates.map(b => [b.s.value, b.date.value.slice(0, 10)]));
  for (const r of rows) r.date = byIri[r.iri];
}

async function loadResults(append, current) {
  let rows, total;
  const note = state.text && searchHits && searchTotal > searchHits.length
    ? `; search uses the first ${searchHits.length} of ${searchTotal} matches` : '';
  if (state.text && searchHits && !state.cls && !state.graph && !state.sort) {
    rows = searchHits.slice(state.offset, state.offset + PAGE)
                     .map(h => ({ iri: h.iri, label: h.label }));
    total = searchHits.length;
    await attachDates(rows);
  } else if (!state.sort) {
    const where = whereWith();
    const [countRows, pageRows] = await Promise.all([
      append ? Promise.resolve(null)
             : sparql(`${PREFIX}SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ${where} }`),
      sparql(`${PREFIX}SELECT ?s (SAMPLE(?l) AS ?label) WHERE {
        { SELECT DISTINCT ?s WHERE { ${where} } ORDER BY ?s LIMIT ${PAGE} OFFSET ${state.offset} }
        OPTIONAL { ?s rdfs:label ?l }
      } GROUP BY ?s ORDER BY ?s`),
    ]);
    if (!current()) return;
    if (countRows) state.total = parseInt(countRows[0].n.value, 10);
    total = state.total;
    rows = pageRows.map(b => ({ iri: b.s.value, label: b.label ? b.label.value : null }));
    await attachDates(rows);
  } else {
    const where = whereWith();
    const order = `DESC(BOUND(?date)) ${state.sort === 'asc' ? 'ASC' : 'DESC'}(?date) ?s`;
    const [countRows, pageRows] = await Promise.all([
      append ? Promise.resolve(null)
             : sparql(`${PREFIX}SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ${where} }`),
      sparql(`${PREFIX}SELECT ?s ?date (SAMPLE(?l) AS ?label) WHERE {
        { SELECT ?s ?date WHERE {
            { SELECT ?s (MIN(?d) AS ?date) WHERE {
                ${where}
                OPTIONAL { ${GIVEN_GRAPHS.length ? inGiven('gDate', '?s ?dp ?d') : '?s ?dp ?d .'} ${DATE_FILTER} }
              } GROUP BY ?s }
          } ORDER BY ${order} LIMIT ${PAGE} OFFSET ${state.offset} }
        OPTIONAL { ?s rdfs:label ?l }
      } GROUP BY ?s ?date ORDER BY ${order}`),
    ]);
    if (!current()) return;
    if (countRows) state.total = parseInt(countRows[0].n.value, 10);
    total = state.total;
    rows = pageRows.map(b => ({ iri: b.s.value,
                                label: b.label ? b.label.value : null,
                                date: b.date ? b.date.value.slice(0, 10) : null }));
  }
  if (!current()) return;
  const shown = state.offset + rows.length;
  const glyph = state.sort === 'desc' ? '▼' : state.sort === 'asc' ? '▲' : '⇅';
  const header = `<h2><span>Entities (${total ? `showing 1–${shown} of ${total}` : '0'}${note})</span>
    ${NO_DATES ? '' : `<button class="clear" id="sortd" title="Sort by date: newest first / oldest first / off">date ${glyph}</button>`}</h2>`;
  const body = rows.map(r => rowHtml(r.iri, r.label, r.date)).join('');
  const more = shown < total
    ? `<div class="row" id="more" style="color:var(--accent)">Load ${Math.min(PAGE, total - shown)} more…</div>` : '';
  const el = document.getElementById('results');
  if (append) {
    document.getElementById('more')?.remove();
    el.querySelector('h2').outerHTML = header;
    el.insertAdjacentHTML('beforeend', body + more);
  } else {
    el.innerHTML = header +
      (rows.length ? body + more
        : '<p style="color:var(--muted)">Nothing matches these facets.</p>');
  }
}

function linksQuery(iri, limit, total) {
  const inGraph = pattern => namedGraphs ? `${GRAPH_VALUES}GRAPH ?g { ${pattern} }` : pattern;
  const g = namedGraphs ? '?g' : '';
  return `${PREFIX}SELECT ?s ?p ${g} (SAMPLE(?sl) AS ?slabel) (SAMPLE(?pl) AS ?plabel) WHERE {
      ${inGraph(`?s ?p <${iri}>`)}
      OPTIONAL { ?s rdfs:label ?sl }
      OPTIONAL { ?p rdfs:label ?pl }
    } GROUP BY ?s ?p ${g} ORDER BY ?p${total ? ` ?s ${g}` : ''} LIMIT ${limit + 1}`;
}

function linkRow(r) {
  const graph = !r.g ? '' :
    ` <span class="t" style="font-size:11px" title="${esc(r.g.value)}">${esc(localName(r.g.value))}</span>`;
  return `<tr><td class="p" title="${esc(r.p.value)}">${esc(r.plabel ? r.plabel.value : localName(r.p.value))}</td>
        <td>${r.s.type === 'bnode'
          ? '<span class="t">[blank node]</span>'
          : `<a href="#" data-iri="${esc(r.s.value)}" title="${esc(r.s.value)}">${esc(r.slabel ? r.slabel.value : short(r.s.value))}</a>${followLink(r.s.value)}`}
        ${graph}</td></tr>`;
}

async function showMoreLinks(button) {
  const pane = button.closest('.pane');
  const want = Number(button.dataset.morelinks) + LINK_CAP;
  button.disabled = true;
  button.textContent = 'loading…';
  try {
    const rows = await sparql(linksQuery(pane.dataset.iri, want, true));
    if (!pane.isConnected) return;
    pane.querySelector('table.links').innerHTML = rows.slice(0, want).map(linkRow).join('');
    if (rows.length > want) {
      button.dataset.morelinks = want;
      button.disabled = false;
      button.textContent = `show ${LINK_CAP} more`;
    } else {
      button.remove();
    }
  } catch (e) {
    button.disabled = false;
    button.textContent = `show ${LINK_CAP} more`;
    fail(e);
  }
}

function detailRows(iri) {
  const inGraph = pattern => namedGraphs ? `${GRAPH_VALUES}GRAPH ?g { ${pattern} }` : pattern;
  return Promise.all([
    sparql(`${PREFIX}SELECT ?p ?o (SAMPLE(?pl) AS ?plabel) (SAMPLE(?ol) AS ?olabel) WHERE {
      ${inGraph(`<${iri}> ?p ?o`)}
      OPTIONAL { ?p rdfs:label ?pl }
      OPTIONAL { ?o rdfs:label ?ol }
    } GROUP BY ?p ?o ORDER BY ?p LIMIT ${FACT_CAP + 1}`),
    sparql(`${PREFIX}SELECT ?p ?b ?p2 ?o2 (SAMPLE(?p2l) AS ?p2label) (SAMPLE(?o2l) AS ?o2label) WHERE {
      ${inGraph(`<${iri}> ?p ?b . ?b ?p2 ?o2 . FILTER(isBlank(?b))`)}
      OPTIONAL { ?p2 rdfs:label ?p2l }
      OPTIONAL { ?o2 rdfs:label ?o2l }
    } GROUP BY ?p ?b ?p2 ?o2 ORDER BY ?p ?b ?p2 LIMIT 300`),
    sparql(linksQuery(iri, LINK_CAP, false)),
  ]);
}

async function loadDetail(iri, pane) {
  const inGraphs = namedGraphs;
  const [factRows, nestedRows, incomingRows] = await detailRows(iri);
  if (!factRows.length && !incomingRows.length && inGraphs) {
    if (!graphsKnown) {
      const anyGraph = await sparql('SELECT ?g WHERE { GRAPH ?g { ?s ?p ?o } } LIMIT 1');
      graphsKnown = true;
      if (!anyGraph.length) namedGraphs = false;
    }
    if (!namedGraphs) return loadDetail(iri, pane);
  }
  const graphOf = r => r.g ? r.g.value : '';
  if (!pane.isConnected) return;
  const term = t => `${t.type}|${t.value}|${t['xml:lang'] || ''}|${t.datatype || ''}`;
  const together = key => (a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0;
  const facts = factRows.slice(0, FACT_CAP);
  const incoming = incomingRows.slice(0, LINK_CAP)
    .sort(together(r => `${r.p.value}|${term(r.s)}|${graphOf(r)}`));
  const moreFacts = factRows.length > FACT_CAP;
  const moreLinks = incomingRows.length > LINK_CAP;
  const linkGraphs = new Set(incoming.map(graphOf).filter(Boolean)).size;
  const nestedGroups = new Map();
  for (const r of nestedRows) {
    const key = `${r.p.value}|${r.b.value}`;
    if (!nestedGroups.has(key)) nestedGroups.set(key, []);
    nestedGroups.get(key).push(r);
  }
  const seenUnder = {};
  for (const row of facts) {
    row.inner = [];
    if (row.o.type !== 'bnode') continue;
    const under = row.p.value;
    const exact = nestedGroups.get(`${under}|${row.o.value}`);
    if (exact) { row.inner = exact; continue; }
    const groups = [...nestedGroups.entries()].filter(([k]) => k.startsWith(under + '|')).map(([, v]) => v);
    const n = seenUnder[under] = (seenUnder[under] || 0) + 1;
    row.inner = groups[n - 1] || [];
  }
  const propCell = r =>
    `<td class="p" title="${esc(r.p.value)}">${esc(r.plabel ? r.plabel.value : localName(r.p.value))}</td>`;
  const iriLink = (v, label) => {
    const app = appLink(v);
    if (app) {
      return `<a class="opens" href="${esc(app.url)}"
                 title="Open in ${esc(app.label)}: ${esc(v)}">${esc(label || short(v))}</a>`
        + followLink(v);
    }
    return `<a href="#" data-iri="${esc(v)}" title="${esc(v)}">${esc(label || short(v))}</a>`
      + followLink(v);
  };
  const innerHtml = rows => rows.map(r => {
    const k = esc(r.p2label ? r.p2label.value : localName(r.p2.value));
    let v = r.o2.type === 'uri' ? iriLink(r.o2.value, r.o2label && r.o2label.value) : esc(r.o2.value);
    if (r.p2.value === 'http://rdfs.org/ns/void#class' && r.o2.type === 'uri')
      v += `<a href="#" class="lst" data-cls="${esc(r.o2.value)}" title="List every entity of this class">list</a>`;
    return `<span class="kv"><span class="k">${k}</span>${v}</span>`;
  }).join('<span class="sep"> · </span>');
  const objCell = r => r.o.type === 'uri'
    ? iriLink(r.o.value, r.olabel && r.olabel.value)
    : r.o.type === 'bnode'
      ? (r.inner.length ? innerHtml(r.inner) : '<span class="t">[blank node]</span>')
      : esc(r.o.value);
  const labelRow = facts.find(r => r.p.value === 'http://www.w3.org/2000/01/rdf-schema#label');
  const heading = labelRow ? labelRow.o.value : localName(iri);
  pane.querySelector('.spine').textContent = heading;
  pane.querySelector('.body').innerHTML =
    `<h2>Entity</h2>` +
    `<p class="ehead">${esc(heading)}</p>` +
    `<p><code title="${esc(iri)}">${esc(short(iri))}</code>${copyButton(iri)}${followLink(iri)}</p>` +
    `<p class="t">${moreFacts || moreLinks ? 'more than ' : ''}${facts.length + incoming.length} facts` +
    (incoming.length ? `, ${moreLinks ? `more than ${LINK_CAP}` : incoming.length} of them linking here` +
      (linkGraphs ? ` from ${linkGraphs} graph${linkGraphs === 1 ? '' : 's'}` : '') : '') +
    (moreFacts || moreLinks ? '; the rest are not shown' : '') + `</p>` +
    `<table>` + facts.map(r =>
      `<tr>${propCell(r)}<td>${objCell(r)}</td></tr>`).join('') +
    `</table>` +
    (incoming.length ? `<h2>Linked from</h2><table class="links">` + incoming.map(linkRow).join('') +
      `</table>` + (moreLinks
        ? `<button class="clear" data-morelinks="${LINK_CAP}" title="The next ${LINK_CAP} links to this entity">show ${LINK_CAP} more</button>`
        : '') : '');
}

async function refresh() {
  const s = document.getElementById('status');
  const current = take('refresh');
  try {
    s.textContent = 'querying…';
    partial = false;
    state.offset = 0;
    await loadSettings();
    if (!await ensureSearch() || !current()) return;
    await Promise.all([loadFacets(take('facets')), loadResults(false, take('results'))]);
    if (!current()) return;
    const scan = searchApi === false && state.text
      ? (FORCE_SPARQL ? ' (forced SPARQL scan)'
        : textIndex && textQuery(state.text) ? ' (Virtuoso text index; matches words, not substrings)'
        : ' (no search sidecar; SPARQL scan)')
      : '';
    const cut = partial ? ' – the endpoint cut some answers short; counts may be incomplete' : '';
    const scope = GIVEN_GRAPHS.length
      ? `, ${GIVEN_GRAPHS.length} graph${GIVEN_GRAPHS.length === 1 ? '' : 's'} only` : '';
    s.textContent = `connected to ${ENDPOINT}${scope}${scan}${cut}`;
  } catch (e) {
    if (current()) fail(e);
  }
}

document.addEventListener('click', e => {
  if (e.target.closest('a.ext, a.app, a.opens')) return;
  const copy = e.target.closest('button.copy');
  if (copy) {
    copyText(copy.id === 'voidcopy' ? scopeVoid() : copy.dataset.copy).then(() => {
      copy.classList.add('done');
      copy.textContent = '✓';
      setTimeout(() => { copy.classList.remove('done'); copy.innerHTML = COPY_ICON; }, 1200);
    });
    return;
  }
  if (e.target.id === 'more') {
    state.offset += PAGE;
    loadResults(true, take('results')).catch(fail);
    return;
  }
  if (e.target.id === 'sortd') {
    state.sort = state.sort === 'desc' ? 'asc' : state.sort === 'asc' ? null : 'desc';
    state.offset = 0;
    loadResults(false, take('results')).catch(fail);
    return;
  }
  const clear = e.target.closest('[data-clear]');
  if (clear) { state[clear.dataset.clear] = null; renderFacets(); refresh(); return; }
  if (e.target.id === 'catlink') { if (CATALOGUE) openEntity(CATALOGUE, null); return; }
  if (e.target.id === 'panes') { setStacked(!stacked); return; }
  const spine = e.target.closest('.spine');
  if (spine) { reveal(spine.parentElement); return; }
  if (e.target === results && results.classList.contains('covered')) {
    strip.scrollTo({ left: 0, behavior: 'smooth' });
    return;
  }
  const cls = e.target.closest('[data-cls]');
  if (cls) {
    e.preventDefault();
    state.cls = cls.dataset.cls; state.graph = null; state.text = ''; state.sort = null;
    document.getElementById('q').value = '';
    refresh();
    return;
  }
  const pin = e.target.closest('button.pin');
  if (pin) { togglePin(pin.dataset.pin); return; }
  if (e.target.id === 'pinreset') { resetPins(); renderFacets(); return; }
  if (e.target.id === 'allcls') { allClasses = true; loadFacets(take('facets')).catch(fail); return; }
  if (e.target.id === 'pincopy') {
    const b = e.target;
    copyText(pinsTurtle()).then(() => {
      b.textContent = 'copied';
      setTimeout(() => { b.textContent = 'copy as Turtle'; }, 1200);
    });
    return;
  }
  const more = e.target.closest('button[data-morelinks]');
  if (more) { showMoreLinks(more); return; }
  const f = e.target.closest('.facet');
  if (f) { state[f.dataset.key] = state[f.dataset.key] === f.dataset.v ? null : f.dataset.v;
           renderFacets(); refresh(); return; }
  const link = e.target.closest('[data-iri]');
  if (link) { e.preventDefault(); openEntity(link.dataset.iri, link.closest('.pane')); }
});
document.getElementById('ep').addEventListener('change', e => {
  const url = e.target.value;
  remember(REMEMBERED, url);
  const params = new URLSearchParams(location.search);
  params.set('endpoint', url);
  location.search = params.toString();
});
const facetsEl = document.getElementById('facets');
let dragged = null;
const dropMarks = () => facetsEl.querySelectorAll('.drop-before, .drop-after')
  .forEach(x => x.classList.remove('drop-before', 'drop-after'));
facetsEl.addEventListener('dragstart', e => {
  const f = e.target.closest('.facet.pinned');
  if (!f) return;
  dragged = f.dataset.v;
  f.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragged);
});
facetsEl.addEventListener('dragover', e => {
  const f = e.target.closest('.facet.pinned');
  if (!dragged || !f) return;
  e.preventDefault();
  const r = f.getBoundingClientRect();
  dropMarks();
  if (f.dataset.v !== dragged)
    f.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
});
facetsEl.addEventListener('drop', e => {
  const f = e.target.closest('.facet.pinned');
  if (!dragged || !f) return;
  e.preventDefault();
  if (f.dataset.v !== dragged) movePin(dragged, f.dataset.v, f.classList.contains('drop-after'));
});
facetsEl.addEventListener('dragend', () => { dragged = null; renderFacets(); });
facetsEl.addEventListener('keydown', e => {
  const f = e.target.closest('.facet.pinned');
  if (!f || e.target !== f) return;
  if (e.key === 'Enter') { f.click(); return; }
  if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const list = pinned(), v = f.dataset.v, i = list.indexOf(v);
  const j = i + (e.key === 'ArrowUp' ? -1 : 1);
  if (j < 0 || j >= list.length) return;
  movePin(v, list[j], e.key === 'ArrowDown');
  [...facetsEl.querySelectorAll('.facet.pinned')].find(x => x.dataset.v === v)?.focus();
});

let timer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.text = e.target.value.trim(); refresh(); }, 300);
});
const PANES = 'opsis-panes';
const detail = document.getElementById('detail');
const strip = document.getElementById('strip');
const results = document.getElementById('results');
let stacked = (new URLSearchParams(location.search).get('panes') || recall(PANES)) === 'stacked';
const panes = () => [...detail.querySelectorAll('.pane[data-iri]')];

function newPane(iri) {
  const p = document.createElement('div');
  p.className = 'pane';
  p.dataset.iri = iri;
  p.innerHTML = `<div class="spine" title="${esc(iri)}">${esc(short(iri))}</div>` +
    `<div class="body"><h2>Entity</h2><p class="t">loading…</p></div>`;
  return p;
}

function openEntity(iri, from) {
  if (phone.matches) return openOnPhone(iri, from);
  detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
  const open = panes();
  if (stacked) {
    const already = open.find(p => p.dataset.iri === iri);
    if (already) { reveal(already); return; }
    const k = from ? open.indexOf(from) : -1;
    open.slice(k + 1).forEach(p => p.remove());
  } else {
    detail.replaceChildren();
  }
  const p = newPane(iri);
  detail.append(p);
  loadDetail(iri, p).catch(fail);
  layout();
  reveal(p);
  syncUrl();
}

function layout() {
  panes().forEach((p, i) => { p.style.left = stacked ? `calc(${i + 1} * var(--spine))` : ''; });
  cover();
}
function reveal(p) {
  panes().forEach(q => q.classList.toggle('here', stacked && q === p));
  if (!stacked) return;
  const before = panes().slice(0, panes().indexOf(p));
  const at = before.reduce((x, q) => x + q.offsetWidth, results.offsetWidth);
  const spine = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spine')) || 36;
  strip.scrollTo({ left: Math.max(0, at - (before.length + 1) * spine), behavior: 'smooth' });
}
function cover() {
  const all = [results, ...panes()];
  all.forEach((p, i) => {
    const next = all[i + 1];
    const covered = stacked && !!next &&
      next.getBoundingClientRect().left - p.getBoundingClientRect().left < p.offsetWidth / 2;
    if (covered && !p.classList.contains('covered')) p.style.setProperty('--st', `${p.scrollTop}px`);
    p.classList.toggle('covered', covered);
  });
}
let coverFrame = 0;
const coverSoon = () => { cancelAnimationFrame(coverFrame); coverFrame = requestAnimationFrame(cover); };
strip.addEventListener('scroll', coverSoon, { passive: true });
addEventListener('resize', coverSoon);

function setStacked(on) {
  stacked = on;
  remember(PANES, on ? 'stacked' : 'single');
  document.body.classList.toggle('stacked', on && !phone.matches);
  detail.classList.toggle('stack', on);
  document.getElementById('panes').setAttribute('aria-pressed', String(on));
  if (!on) panes().slice(0, -1).forEach(p => p.remove());
  layout();
  syncUrl();
}

function syncUrl() {
  if (phone.matches) return;
  const params = new URLSearchParams(location.search);
  params.delete('open');
  for (const p of panes()) params.append('open', p.dataset.iri);
  if (stacked) params.set('panes', 'stacked');
  else params.delete('panes');
  const q = params.toString();
  history.replaceState(null, '', q ? `?${q}` : location.pathname);
}

const phone = matchMedia('(pointer: coarse) and (max-width: 640px), (pointer: coarse) and (max-height: 500px)');
const mainEl = document.querySelector('main');
const nav = document.getElementById('nav');
let atPage = 0;
let slideBack = false;
const pages = () => [facetsEl, results, ...panes()];
const firstPage = () => offered.cls !== null && !facetsEl.querySelector('.facet') ? 1 : 0;

function show(n, instant) {
  const all = pages();
  atPage = Math.min(Math.max(n, firstPage()), all.length - 1);
  void mainEl.offsetWidth;
  mainEl.classList.toggle('instant', !!instant);
  mainEl.style.setProperty('--at', atPage);
  if (instant) { void mainEl.offsetWidth; mainEl.classList.remove('instant'); }
  all.forEach((p, i) => { p.inert = i !== atPage; });
  renderNav();
}

function renderNav() {
  if (!phone.matches) return;
  nav.hidden = atPage <= firstPage();
  if (nav.hidden) return;
  const name = n => n === 0 ? (shown('cls') || pinned().length ? 'Classes' : 'Graphs')
    : n === 1 ? 'Entities' : panes()[n - 2].querySelector('.spine').textContent;
  document.getElementById('back').textContent = `‹ ${name(atPage - 1)}`;
  document.getElementById('scope').innerHTML = atPage !== 1 ? '' :
    ['cls', 'graph'].filter(k => state[k]).map(k => {
      const v = state[k];
      const b = k === 'cls' ? [...facetRows.pins, ...facetRows.classes].find(r => r.c.value === v)
                            : facetRows.graphs.find(r => r.g.value === v);
      const label = b && (k === 'cls' ? b.label : b.title);
      const nm = esc(label ? label.value : localName(v));
      return `<button class="chip" data-clear="${k}" aria-label="Clear ${nm}">${nm} ×</button>`;
    }).join('');
}

function goTo(n) {
  const from = atPage;
  show(n);
  history.pushState({opsis: true, at: atPage, up: atPage === from + 1}, '', phoneHref());
}
function phoneHref() {
  const params = new URLSearchParams(location.search);
  params.delete('open');
  for (const p of panes().slice(0, Math.max(0, atPage - 1))) params.append('open', p.dataset.iri);
  const q = params.toString();
  return q ? `?${q}` : location.pathname;
}

function openOnPhone(iri, from) {
  detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
  const open = panes();
  const k = from ? open.indexOf(from) : -1;
  if (!open[k + 1] || open[k + 1].dataset.iri !== iri) {
    open.slice(k + 1).forEach(p => p.remove());
    const p = newPane(iri);
    detail.append(p);
    loadDetail(iri, p).then(renderNav, fail);
  }
  goTo(k + 3);
}

function restore(want, n, instant, ready = Promise.resolve()) {
  const open = panes();
  let i = 0;
  while (i < want.length && open[i] && open[i].dataset.iri === want[i]) i++;
  if (i < want.length) {
    detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
    open.slice(i).forEach(p => p.remove());
    for (const iri of want.slice(i)) {
      const p = newPane(iri);
      detail.append(p);
      ready.then(() => loadDetail(iri, p)).then(renderNav, fail);
    }
  }
  show(n ?? (want.length ? want.length + 1 : 0), instant);
}

document.getElementById('back').addEventListener('click', () => {
  if (history.state && history.state.up) { slideBack = true; history.back(); }
  else goTo(atPage - 1);
});
addEventListener('popstate', e => {
  if (!phone.matches) return;
  restore(new URLSearchParams(location.search).getAll('open'),
          e.state && e.state.opsis ? e.state.at : null, !slideBack);
  slideBack = false;
});
document.addEventListener('click', e => {
  if (!phone.matches) return;
  if (e.target.closest('[data-clear]')) { renderNav(); return; }
  const f = e.target.closest('.facet');
  if ((f && !e.target.closest('button.pin') && state[f.dataset.key] === f.dataset.v)
      || e.target.closest('[data-cls]')) goTo(1);
});
const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { if (phone.matches && atPage !== 1 && qEl.value.trim()) goTo(1); });
qEl.addEventListener('keydown', e => { if (phone.matches && e.key === 'Enter') qEl.blur(); });
phone.addEventListener('change', () => {
  if (phone.matches) {
    setStacked(stacked);
    show(panes().length ? panes().length + 1 : state.cls || state.graph || state.text ? 1 : 0, true);
    history.replaceState({opsis: true, at: atPage, up: false}, '', phoneHref());
    return;
  }
  panes().slice(Math.max(0, atPage - 1)).forEach(p => p.remove());
  pages().forEach(p => { p.inert = false; });
  nav.hidden = true;
  mainEl.style.removeProperty('--at');
  setStacked(stacked);
});

const reopen = new URLSearchParams(location.search).getAll('open');
const landing = history.state;
setStacked(stacked);
const started = refresh();
if (phone.matches) {
  restore(reopen, null, true, started);
  history.replaceState({opsis: true, at: atPage,
    up: !!(landing && landing.up && landing.at === atPage)}, '', phoneHref());
  started.then(() => {
    if (atPage >= firstPage()) return;
    show(firstPage(), true);
    history.replaceState({opsis: true, at: atPage, up: false}, '', phoneHref());
  });
} else {
  started.then(() => {
    let from = null;
    for (const iri of stacked ? reopen : reopen.slice(-1)) {
      openEntity(iri, from);
      from = panes().at(-1);
    }
  });
}
</script>
</body>
