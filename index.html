<style>
  :root {
    color-scheme: light dark;
    --pane-w: min(560px, 88vw); --spine: 36px;
    --bg: #fbfbfa; --panel: #fff; --ink: #1b1b1a; --muted: #6b6b68;
    --line: #e3e3df; --accent: #2a6f97; --on-accent: #fff; --chip: #eef3f6;
    --sb: #c6c6c1; --sb-hover: #a8a8a2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --panel:#1d1f23; --ink:#e8e8e6; --muted:#9a9a96;
            --line:#2c2f34; --accent:#7ab6d9; --on-accent:#16171a; --chip:#232830;
            --sb:#3b3f46; --sb-hover:#4c515a; }
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--sb) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--sb); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sb-hover); }
  body { margin:0; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh;
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  h1 { margin:0; font-size:15px; line-height:1; }
  h1 .logo { display:inline-block; height:18px; width:auto; vertical-align:-5.4px; }
  #status { color:var(--muted); font-size:12px; }
  #q { margin-left:auto; padding:6px 10px; border:1px solid var(--line);
       border-radius:6px; background:var(--panel); color:var(--ink); min-width:220px; }
  main { display:grid; grid-template-columns:auto 1fr 1.2fr; gap:0; flex:1; min-height:0; }
  section { overflow:auto; padding:12px 14px; border-right:1px solid var(--line); }
  #facets { width:280px; min-width:170px; max-width:60vw; resize:horizontal; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--muted); margin:14px 0 6px; font-weight:600; }
  h2:first-child { margin-top:0; }
  #results h2 { display:flex; justify-content:space-between; align-items:baseline;
                gap:10px; padding:0 6px; }
  h2 .typed { text-transform:none; letter-spacing:normal; }
  .facet { display:flex; justify-content:space-between; gap:8px; padding:4px 6px;
           border-radius:4px; cursor:pointer; align-items:baseline; }
  .facet:hover { background:var(--chip); }
  .facet.on { background:var(--accent); color:var(--on-accent); }
  .facet .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .facet.on .n { color:var(--on-accent); opacity:.8; }
  .facet .ns { color:var(--muted); font-size:11px; margin-left:5px; }
  .facet.on .ns { color:var(--on-accent); opacity:.75; }
  .facet .r { display:flex; gap:6px; align-items:baseline; }
  button.seek { border:0; background:none; padding:0 2px; margin-left:4px; cursor:pointer;
                color:inherit; opacity:0; line-height:1; vertical-align:-1px; }
  h2:hover button.seek, button.seek:focus-visible { opacity:.7; }
  button.seek.on, button.seek:hover { opacity:1; color:var(--accent); }
  button.pin { border:0; background:none; padding:0; cursor:pointer; color:inherit;
               opacity:0; line-height:1; align-self:center; }
  .facet:hover button.pin, button.pin:focus-visible { opacity:.7; }
  .facet.pinned button.pin { opacity:.45; }
  button.pin:hover { opacity:1 !important; }
  .facet.pinned { cursor:grab; }
  .facet.zero { opacity:.55; }
  .facet.dragging { opacity:.4; }
  .facet.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
  .facet.drop-after { box-shadow:inset 0 -2px 0 var(--accent); }
  .allcls { padding:4px 6px; }
  .pinbar { border-top:1px solid var(--line); margin:4px 0; padding-top:2px;
            display:flex; justify-content:flex-end; gap:10px; min-height:0; }
  .row { padding:5px 6px; border-radius:4px; cursor:pointer; }
  .row:hover { background:var(--chip); }
  .row .t, .t { color:var(--muted); font-size:12px; }
  .row .r1 { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .row .d { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;
            white-space:nowrap; }
  .ehead { font-size:15px; font-weight:600; margin:2px 0 2px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:3px 6px; vertical-align:top; border-bottom:1px solid var(--line); }
  td.p { white-space:nowrap; width:1%; }
  a { color:var(--accent); }
  code { font:12px/1.4 ui-monospace,Consolas,monospace; word-break:break-all; }
  button.clear { border:0; background:none; color:var(--accent); cursor:pointer;
                 font-size:12px; padding:0; text-transform:none; letter-spacing:normal; }
  #catlink { font-size:12px; border:0; background:none; color:var(--accent);
             cursor:pointer; padding:0; text-transform:none; letter-spacing:normal;
             font-family:inherit; }
  #catlink:hover { text-decoration:underline; }
  #voidcopy { margin-left:-10px; }
  .kv .k { color:var(--muted); font-size:12px; margin-right:3px; }
  .sep { color:var(--muted); }
  a.lst { font-size:11px; margin-left:4px; padding:0 4px; border:1px solid var(--line);
          border-radius:3px; text-decoration:none; }
  a.ext { color:var(--muted); text-decoration:none; font-size:11px; }
  a.ext:hover { color:var(--accent); }
  button.copy { border:0; background:none; padding:0 2px; margin-left:3px; cursor:pointer;
                color:var(--muted); font-size:11px; line-height:1; vertical-align:-1px; }
  button.copy:hover, button.copy.done { color:var(--accent); }
  a.app { color:var(--muted); text-decoration:none; font-size:11px; margin-left:4px;
          padding:0 4px; border:1px solid var(--line); border-radius:3px; }
  a.app:hover { color:var(--accent); border-color:var(--accent); }
  a.opens { color:var(--accent); text-decoration:none; }
  a.opens:hover { text-decoration:underline; }
  #strip, #detail.stack { display:contents; }
  #gh-link { display:flex; align-self:center; color:var(--ink); opacity:.7; }
  #gh-link:hover { opacity:1; }
  #version { position:fixed; left:0; bottom:0; padding:2px 8px; font-size:10px;
             color:var(--muted); background:var(--bg); text-decoration:none;
             border-top-right-radius:4px; opacity:.8; }
  #version:hover { opacity:1; color:var(--accent); }
  #facets { padding-bottom:28px; }
  #panes, #skosbtn { font:inherit; font-size:12px; border:1px solid var(--line); border-radius:3px;
           background:none; color:var(--muted); cursor:pointer; padding:0 6px; }
  #panes[aria-pressed="true"], #skosbtn[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); }
  .tree .node { display:flex; align-items:baseline; gap:4px; border-radius:4px;
                padding:2px 6px 2px calc(6px + var(--d, 0) * 16px); }
  .tree .node:hover { background:var(--chip); }
  button.chev { border:0; background:none; padding:0; width:14px; flex:none; cursor:pointer;
                color:var(--muted); font:inherit; font-size:11px; line-height:1; }
  button.chev:hover { color:var(--accent); }
  span.chev { width:14px; flex:none; }
  .tree a { color:var(--ink); text-decoration:none; }
  .tree a:hover { color:var(--accent); }
  .tree .hit > a { font-weight:600; }
  .tree .nt, .tree .n { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .tree .n { margin-left:auto; }
  #results .tools { display:flex; gap:10px; }
  #facets.folded { width:var(--spine) !important; min-width:0; resize:none; overflow:hidden;
                   padding:0; cursor:pointer; }
  #facets.folded > * { display:none; }
  #facets.folded::before { content:attr(data-spine); display:block; writing-mode:vertical-rl;
                           padding:14px 0 0 10px; font-size:13px; color:var(--muted); white-space:nowrap; }
  #facets.folded:hover::before { color:var(--accent); }
  body.stacked main { grid-template-columns:auto 1fr; }
  body.stacked #strip { display:flex; overflow-x:auto; overflow-y:hidden;
                        position:relative; min-width:0; height:100%; }
  body.stacked #results, body.stacked .pane {
    position:sticky; flex:0 0 var(--pane-w); width:var(--pane-w); height:100%;
    overflow:auto; background:var(--bg); padding:12px 14px;
    border-right:1px solid var(--line); box-shadow:-6px 0 10px -8px rgba(0,0,0,.4); }
  body.stacked #results { left:0; box-shadow:none; }
  .spine { display:none; }
  body.stacked .pane.covered > .body,
  body.stacked #results.covered > * { visibility:hidden; }
  body.stacked .pane.covered, body.stacked #results.covered { overflow:hidden; }
  body.stacked .pane.covered > .spine, body.stacked #results.covered::before {
    display:block; position:absolute; top:var(--st, 0px); left:0; height:100%; width:var(--spine);
    cursor:pointer; writing-mode:vertical-rl; padding:14px 0 0 10px;
    font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; }
  body.stacked #results.covered::before { content:'Entities'; }
  body.stacked.skos #results.covered::before { content:'Concepts'; }
  .spine:hover, body.stacked #results.covered:hover::before { color:var(--accent); }
  body.stacked .pane.here { box-shadow:-6px 0 10px -8px rgba(0,0,0,.4), inset 3px 0 0 var(--accent); }
  #ep { font: inherit; font-size:12px; color:var(--ink); background:var(--panel);
        border:1px solid var(--line); border-radius:3px; padding:1px 4px; max-width:22em; }
  @media (pointer: coarse) and (max-width: 640px), (pointer: coarse) and (max-height: 500px) {
    body { height:100vh; height:100dvh; }
    header { padding:8px 12px; gap:6px 10px; align-items:center; }
    header::after { content:''; order:3; flex-basis:100%; }
    #q { order:1; flex:1; min-width:0; margin-left:0; font-size:16px; }
    #gh-link { order:2; }
    #status { order:4; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #ep, #catlink, #skosbtn { order:5; }
    #panes, #voidcopy { display:none; }
    body { font-size:15px; }
    h2, .facet .ns, a.lst, a.ext, a.app { font-size:12px; }
    #status, .facet .n, .row .t, .t, .row .d, .kv .k, button.clear, #catlink, #ep, code { font-size:13px; }
    .ehead { font-size:17px; }
    button.copy svg, button.pin svg, button.seek svg { width:13px; height:13px; }
    #nav:not([hidden]) { display:flex; align-items:center; gap:8px; padding:0 12px 0 4px;
                         border-bottom:1px solid var(--line); }
    #back { border:0; background:none; color:var(--accent); font:inherit; font-size:16px;
            padding:10px 8px; cursor:pointer; min-width:0; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
    #scope { display:flex; gap:6px; margin-left:auto; min-width:0; }
    .chip { font:inherit; font-size:13px; border:0; border-radius:4px; padding:4px 8px;
            background:var(--accent); color:var(--on-accent); cursor:pointer; min-width:0;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    main { display:flex; overflow:hidden; overflow:clip; }
    #strip, #detail { display:contents; }
    #facets, #results, #detail > .pane {
      flex:0 0 100%; width:100%; min-width:0; max-width:none; resize:none;
      overflow-x:hidden; overflow-y:auto; padding:12px 14px; border-right:0;
      overflow-wrap:anywhere; transform:translateX(calc(var(--at, 0) * -100%));
      transition:transform .25s ease; }
    main.instant #facets, main.instant #results, main.instant #detail > .pane { transition:none; }
    #detail > .pane:not([data-iri]) { display:none; }
    .facet { padding:9px 8px; }
    .row { padding:8px 6px; }
    .row .t { display:flex; align-items:center; }
    .row .t code { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .t > :not(code) { flex:none; }
    button.pin { opacity:.35; padding:6px; margin:-6px; }
    .facet.pinned button.pin { opacity:.6; }
    button.seek { opacity:.35; padding:6px; margin:-6px 0; }
    button.copy { padding:6px; margin-top:-6px; margin-bottom:-6px; }
    a.ext { padding:6px 4px; }
    #detail table, #detail tbody, #detail tr, #detail td { display:block; width:auto; }
    #detail td.p { white-space:normal; border-bottom:0; padding:7px 6px 0;
                   color:var(--muted); font-size:13px; }
    #detail td.p + td { padding:1px 6px 7px; }
    #facets, #results, #detail > .pane { padding-bottom:28px; }
    @media (prefers-reduced-motion: reduce) {
      #facets, #results, #detail > .pane { transition:none; }
    }
  }
</style>
</head>

async function probeSearchApi() {
  if (FORCE_SPARQL) { searchApi = false; return; }

  try {
    const u = new URL(ENDPOINT);
    const candidate = `${u.origin}/search`;
    const r = await fetch(`${candidate}?q=&limit=1`);

    searchApi = j && Array.isArray(j.results) && typeof j.total === 'number' ? candidate : false;
  } catch (e) { searchApi = false; }

  try {
    await sparql(`SELECT ?o WHERE { ${scoped(`?s ?p ?o . ?o bif:contains '"opsis"' .`)} } LIMIT 1`);
    const [b] = known ? [] : await sparql(`SELECT ?o WHERE { ${scoped('?s ?p ?o .')}

function textQuery(text) {
  const words = text.match(/[\p{L}\p{N}]+/gu);

  return words.map(w => w.length >= 4 ? `"${w}*"` : `"${w}"`).join(' AND ');
}

async function ensureSearch() {
  if (!state.text) { searchHits = null; searchTotal = 0; return true; }

  if (!searchApi) {

  const j = await r.json();
  if (text !== state.text) return false;
  searchHits = j.results;

}

function textClause() {
  if (!state.text) return '';
  if (searchHits) return `VALUES ?s { ${searchHits.map(h => `<${h.iri}>`).join(' ')} }`;
  const words = textIndex && textQuery(state.text);
  if (words) {
    const match = `?s ?sfP ?sfV . ?sfV bif:contains '${words}' .`;
    if (GIVEN_GRAPHS.length && textFlat) return `${match}\n  ${inGiven('gText', '?s a ?gtT')}`;
    return GIVEN_GRAPHS.length
      ? `{ SELECT DISTINCT ?s WHERE { ${match} } }\n  FILTER EXISTS { ${inGiven('gText', '?s ?gtP ?gtO')} }`
      : match;
  }
  const t = state.text.replace(/["\\]/g, '\\$&');
  return GIVEN_GRAPHS.length
    ? `${inGiven('gText', '?s ?sfP ?sfV')} FILTER(isLiteral(?sfV) && CONTAINS(LCASE(STR(?sfV)), LCASE("${t}")))`
    : `?s ?sfP ?sfV . FILTER(isLiteral(?sfV) && CONTAINS(LCASE(STR(?sfV)), LCASE("${t}")))`;
}

async function loadPins() {
  try {
    const rows = await sparql(`PREFIX cfg: <https://kvistgaard.github.io/config#>
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      SELECT ?config ?list ?c (COUNT(?mid) AS ?pos) WHERE {
        ?config a cfg:Configuration ; cfg:pinnedClasses ?list .
        ?list rdf:rest* ?mid . ?mid rdf:rest* ?cell . ?cell rdf:first ?c .
      } GROUP BY ?config ?list ?cell ?c ORDER BY ?config ?list ?pos`);
    const first = rows.length ? rows[0].list.value : null;
    storePins = [...new Set(rows.filter(b => b.list.value === first).map(b => b.c.value))]
      .filter(iriSafe);

      : (await sparql(`SELECT ?config WHERE {
          ?config a <https://kvistgaard.github.io/config#Configuration> } LIMIT 1`))[0]?.config;
    storeConfig = cfg && cfg.type === 'uri' ? cfg.value : null;
    if (ownPins && samePins(ownPins, storePins)) resetPins();
    return true;
  } catch (e) { return false; }
}

async function loadEndpoints() {

  try {
    const rows = await sparql(`PREFIX dcat: <http://www.w3.org/ns/dcat#>
      PREFIX dcterms: <http://purl.org/dc/terms/>

    const seen = new Map();
    for (const b of rows) seen.set(b.url.value, b.title ? b.title.value : b.url.value);
    if (!seen.has(ENDPOINT)) seen.set(ENDPOINT, ENDPOINT);
    if (seen.size < 2) { sel.hidden = true; return true; }
    sel.innerHTML = [...seen].map(([url, title]) =>
      `<option value="${esc(url)}"${url === ENDPOINT ? ' selected' : ''}

async function loadPrefixes() {
  try {
    const rows = await sparql(`SELECT DISTINCT ?ns ?prefix WHERE {
      { ?o <http://purl.org/vocab/vann/preferredNamespaceUri> ?ns ;
           <http://purl.org/vocab/vann/preferredNamespacePrefix> ?prefix }
      UNION
      { ?d <http://www.w3.org/ns/shacl#declare> ?decl .
        ?decl <http://www.w3.org/ns/shacl#namespace> ?ns ;
              <http://www.w3.org/ns/shacl#prefix> ?prefix }

    for (const b of rows) {
      const ns = String(b.ns.value), pfx = String(b.prefix.value);

const localName = u => {

};
const GENERIC = new Set(['ns', 'ontology', 'ontologies', 'terms', 'term', 'vocab', 'vocabulary',
  'schema', 'schemas', 'def', 'core', 'resource', 'resources', 'property', 'properties', 'class',
  'classes', 'owl', 'rdf', 'voc', 'model', 'id', 'entity']);

  const s = short(u);

              .replace(/^https?:\/\//, '');
  if (!ns) return AUTHORITY ? new URL(AUTHORITY).hostname.replace(/^www\./, '') : '';
  if (!ns.includes('/')) return ns;
  const [host, ...path] = ns.split('/').filter(Boolean);
  const named = path.filter(p => !GENERIC.has(p.toLowerCase()) && !/^[\d.v-]+$/i.test(p));
  if (named.length) return named.pop();

  let r;

    r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Accept': 'application/sparql-results+json'},
      body: new URLSearchParams({query}),

  } catch (e) {
    if (again) throw e;
    const turn = retries.then(async () => {
      for (let i = 0; i < 50 && running > 0; i++) await pause(100);
      await pause(1000);
      return sparql(query, true);

function filters(except, bound = false) {
  const out = [];
  if (state.cls && except !== 'cls') {
    out.push(GIVEN_GRAPHS.length
      ? `?leaf rdfs:subClassOf* <${state.cls}> .\n  ${inGiven('gType', '?s a ?leaf')}`
      : `?s a/rdfs:subClassOf* <${state.cls}> .`);
  }
  const t = except && state.within ? '' : textClause();
  if (state.graph && except !== 'graph') {
    const exists = GIVEN_GRAPHS.length && (bound || out.length + (t ? 1 : 0) > 0);
    out.push(exists ? `FILTER EXISTS { GRAPH <${state.graph}> { ?s ?anyP ?anyO } }`
                   : `GRAPH <${state.graph}> { ?s ?anyP ?anyO }`);
  }

  return out.join('\n  ');

    !shown('graph') ? [] : sparql(`${PREFIX}SELECT ?g ?n (SAMPLE(?t) AS ?title) WHERE {

function renderFacets() {
  if (sk.on) { renderSchemes(); return; }
  const {classes, graphs} = facetRows;
  const pins = pinned();
  const known = new Map([...classes, ...facetRows.pins].map(b => [b.c.value, b]));
  const pinRows = pins.map(c => known.get(c) || {c: {value: c}});

    return rows.filter(b => key !== target || !sought ||
        [nameOf(b), iriOf(b), nsHint(iriOf(b))].some(s => s.toLowerCase().includes(sought))).map(b => {
      found[key]++;

      const hint = (always || seen[nm] > 1) ? `<span class="ns">· ${esc(nsHint(v))}</span>` : '';
      const pin = key !== 'cls' ? '' :
        `<button class="pin" data-pin="${esc(v)}" title="${isPinned ? 'Unpin' : 'Pin to the top'}"

      const cls = ['facet', state[key] === v ? 'on' : '', isPinned ? 'pinned' : '', n === '0' ? 'zero' : ''];
      return `<div class="${cls.join(' ').trim()}" data-key="${key}" data-v="${esc(v)}" title="${esc(v)}"${
                   isPinned ? ' draggable="true" tabindex="0"' : ''}>

    }).join('');

    `<h2>${title}${seekButton(key)} ${state[key] ? `<button class="clear" data-clear="${key}">clear</button>` : ''}</h2>` + body +
    (key === target && sought && !found[key]
      ? `<p class="t">No ${title.toLowerCase()} matches “${esc(sectionFilter[key])}”.</p>` : '');
  const clsName = b => b.label ? b.label.value : localName(b.c.value);

  const list = pinned().filter(c => c !== iri);
  const at = list.indexOf(target);

const isLocalFile = iri => iri.startsWith('file:');
const followable = iri =>
  (/^https?:\/\//.test(iri) && !(AUTHORITY && iri.startsWith(AUTHORITY))) ||
  (isLocalFile(iri) && location.protocol === 'file:');
let openRules = [];
async function loadOpenRules() {
  try {
    const rows = await sparql(`PREFIX cfg: <https://kvistgaard.github.io/config#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?prefix ?ext ?template ?label WHERE {
        ?config a cfg:Configuration ; cfg:dereferenceRule ?rule .
        ?rule cfg:template ?template .
        OPTIONAL { ?rule cfg:uriPrefix ?prefix }
        OPTIONAL { ?rule cfg:fileExtension ?ext }
        OPTIONAL { ?rule rdfs:label ?label }
      }`);
    openRules = rows.map(b => ({
      prefix: b.prefix ? b.prefix.value : '',
      ext: b.ext ? b.ext.value.toLowerCase().replace(/^\./, '') : '',
      template: b.template.value,
      label: b.label ? b.label.value : 'open',
    })).sort((a, b) => b.prefix.length - a.prefix.length || (b.ext ? 1 : 0) - (a.ext ? 1 : 0));
    return true;
  } catch (e) { openRules = []; return false; }
}

const BAD_SCHEME = /^(javascript|data|blob|vbscript):/i;
function appLink(iri) {
  for (const r of openRules) {
    if (r.prefix && !iri.startsWith(r.prefix)) continue;
    if (r.ext && !iri.split(/[?#]/)[0].toLowerCase().endsWith('.' + r.ext)) continue;
    let path = '', pathenc = '';
    if (isLocalFile(iri)) {
      try {
        let rest = iri.replace(/^file:\/\/(localhost)?/i, '').split(/[?#]/)[0];
        if (/^\/[A-Za-z]:/.test(rest)) rest = rest.slice(1);
        path = decodeURIComponent(rest);
        pathenc = encodeURIComponent(path);
      } catch (e) { path = pathenc = ''; }
    }
    const url = r.template
      .split('{RAW}').join(iri)
      .split('{URI}').join(encodeURIComponent(iri))
      .split('{LOCAL}').join(r.prefix ? iri.slice(r.prefix.length) : iri)
      .split('{PATHENC}').join(pathenc)
      .split('{PATH}').join(path);
    if (BAD_SCHEME.test(url) || !/^[a-z][a-z0-9+.-]*:/i.test(url)) return null;
    return { url, label: r.label };
  }
  return null;
}

const followLink = iri => {
  const app = appLink(iri);
  const appHtml = app
    ? ` <a class="app" href="${esc(app.url)}"
             title="Open ${esc(iri)} in ${esc(app.label)}">${esc(app.label)}</a>`
    : '';
  if (!followable(iri)) return appHtml;
  return ` <a class="ext" href="${esc(iri)}" target="_blank" rel="noopener"
              title="Open ${esc(iri)} in a new tab">↗</a>` + appHtml;
};

const COPY_ICON = '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.6"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/>' +
  '<path d="M10.5 3.5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1h.5"/></svg>';
const PIN_ICON = '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h4M7 2v4.5L4.5 9.5h7L9 6.5V2M8 9.5V14"/></svg>';
const copyButton = iri =>
  `<button class="copy" data-copy="${esc(iri)}" title="Copy ${esc(iri)}" aria-label="Copy IRI">${COPY_ICON}</button>`;
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
}

const rowHtml = (iri, label, date) =>
  `<div class="row" data-iri="${esc(iri)}">
     <div class="r1"><span>${esc(label || short(iri))}</span>${
       date ? `<span class="d">${esc(date)}</span>` : ''}</div>
     <div class="t"><code>${esc(short(iri))}</code>${copyButton(iri)}${followLink(iri)}</div></div>`;

async function attachDates(rows) {
  if (NO_DATES) return;
  const safe = rows.filter(r => /^[a-z][a-z0-9+.-]*:/i.test(r.iri) && !/[\s<>"{}|^`]/.test(r.iri));
  if (!safe.length) return;
  const dates = await sparql(`SELECT ?s (MIN(?d) AS ?date) WHERE {
    VALUES ?s { ${safe.map(r => `<${r.iri}>`).join(' ')} }
    ${GIVEN_GRAPHS.length ? inGiven('gDate', '?s ?dp ?d') : '?s ?dp ?d .'} ${DATE_FILTER}
  } GROUP BY ?s`);
  const byIri = Object.fromEntries(dates.map(b => [b.s.value, b.date.value.slice(0, 10)]));
  for (const r of rows) r.date = byIri[r.iri];
}

async function loadResults(append, current) {
  let rows, total;
  const note = state.text && searchHits && searchTotal > searchHits.length
    ? `; search uses the first ${searchHits.length} of ${searchTotal} matches` : '';
  if (state.text && searchHits && !state.cls && !state.graph && !state.sort) {
    rows = searchHits.slice(state.offset, state.offset + PAGE)
                     .map(h => ({ iri: h.iri, label: h.label }));
    total = searchHits.length;
    await attachDates(rows);
  } else if (!state.sort) {
    const where = whereWith();
    const [countRows, pageRows] = await Promise.all([
      append ? Promise.resolve(null)
             : sparql(`${PREFIX}SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ${where} }`),
      sparql(`${PREFIX}SELECT ?s (SAMPLE(?l) AS ?label) WHERE {
        { SELECT DISTINCT ?s WHERE { ${where} } ORDER BY ?s LIMIT ${PAGE} OFFSET ${state.offset} }
        OPTIONAL { ?s rdfs:label ?l }
      } GROUP BY ?s ORDER BY ?s`),
    ]);
    if (!current()) return;
    if (countRows) state.total = parseInt(countRows[0].n.value, 10);
    total = state.total;
    rows = pageRows.map(b => ({ iri: b.s.value, label: b.label ? b.label.value : null }));
    await attachDates(rows);
  } else {
    const where = whereWith();
    const order = `DESC(BOUND(?date)) ${state.sort === 'asc' ? 'ASC' : 'DESC'}(?date) ?s`;
    const [countRows, pageRows] = await Promise.all([
      append ? Promise.resolve(null)
             : sparql(`${PREFIX}SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ${where} }`),
      sparql(`${PREFIX}SELECT ?s ?date (SAMPLE(?l) AS ?label) WHERE {
        { SELECT ?s ?date WHERE {
            { SELECT ?s (MIN(?d) AS ?date) WHERE {
                ${where}
                OPTIONAL { ${GIVEN_GRAPHS.length ? inGiven('gDate', '?s ?dp ?d') : '?s ?dp ?d .'} ${DATE_FILTER} }
              } GROUP BY ?s }
          } ORDER BY ${order} LIMIT ${PAGE} OFFSET ${state.offset} }
        OPTIONAL { ?s rdfs:label ?l }
      } GROUP BY ?s ?date ORDER BY ${order}`),
    ]);
    if (!current()) return;
    if (countRows) state.total = parseInt(countRows[0].n.value, 10);
    total = state.total;
    rows = pageRows.map(b => ({ iri: b.s.value,
                                label: b.label ? b.label.value : null,
                                date: b.date ? b.date.value.slice(0, 10) : null }));
  }
  if (!current() || sk.on) return;
  const shown = state.offset + rows.length;
  const glyph = state.sort === 'desc' ? '▼' : state.sort === 'asc' ? '▲' : '⇅';
  const sought = state.text ? ` matching <span class="typed">“${esc(state.text)}”</span>` : '';
  const header = `<h2><span>Entities${sought} (${total ? `showing 1–${shown} of ${total}` : '0'}${note})${seekButton('list')}</span>
    ${NO_DATES ? '' : `<button class="clear" id="sortd" title="Sort by date: newest first / oldest first / off">date ${glyph}</button>`}</h2>`;
  const body = rows.map(r => rowHtml(r.iri, r.label, r.date)).join('');
  const more = shown < total
    ? `<div class="row" id="more" style="color:var(--accent)">Load ${Math.min(PAGE, total - shown)} more…</div>` : '';
  const el = document.getElementById('results');
  if (append) {
    document.getElementById('more')?.remove();
    el.querySelector('h2').outerHTML = header;
    el.insertAdjacentHTML('beforeend', body + more);
  } else {
    el.innerHTML = header +
      (rows.length ? body + more
        : '<p style="color:var(--muted)">Nothing matches these facets.</p>');
  }
}

function linksQuery(iri, limit, total) {
  const inGraph = pattern => namedGraphs ? `${GRAPH_VALUES}GRAPH ?g { ${pattern} }` : pattern;
  const g = namedGraphs ? '?g' : '';
  return `${PREFIX}SELECT ?s ?p ${g} (SAMPLE(?sl) AS ?slabel) (SAMPLE(?pl) AS ?plabel) WHERE {
      ${inGraph(`?s ?p <${iri}>`)}
      OPTIONAL { ?s rdfs:label ?sl }
      OPTIONAL { ?p rdfs:label ?pl }
    } GROUP BY ?s ?p ${g} ORDER BY ?p${total ? ` ?s ${g}` : ''} LIMIT ${limit + 1}`;
}

function linkRow(r) {
  const graph = !r.g ? '' :
    ` <span class="t" style="font-size:11px" title="${esc(r.g.value)}">${esc(localName(r.g.value))}</span>`;
  return `<tr><td class="p" title="${esc(r.p.value)}">${esc(r.plabel ? r.plabel.value : localName(r.p.value))}</td>
        <td>${r.s.type === 'bnode'
          ? '<span class="t">[blank node]</span>'
          : `<a href="#" data-iri="${esc(r.s.value)}" title="${esc(r.s.value)}">${esc(r.slabel ? r.slabel.value : short(r.s.value))}</a>${followLink(r.s.value)}`}
        ${graph}</td></tr>`;
}

async function showMoreLinks(button) {
  const pane = button.closest('.pane');
  const want = Number(button.dataset.morelinks) + LINK_CAP;
  button.disabled = true;
  button.textContent = 'loading…';
  try {
    const rows = await sparql(linksQuery(pane.dataset.iri, want, true));
    if (!pane.isConnected) return;
    pane.querySelector('table.links').innerHTML = rows.slice(0, want).map(linkRow).join('');
    if (rows.length > want) {
      button.dataset.morelinks = want;
      button.disabled = false;
      button.textContent = `show ${LINK_CAP} more`;
    } else {
      button.remove();
    }
  } catch (e) {
    button.disabled = false;
    button.textContent = `show ${LINK_CAP} more`;
    fail(e);
  }
}

function detailRows(iri) {
  const inGraph = pattern => namedGraphs ? `${GRAPH_VALUES}GRAPH ?g { ${pattern} }` : pattern;
  return Promise.all([
    sparql(`${PREFIX}SELECT ?p ?o (SAMPLE(?pl) AS ?plabel) (SAMPLE(?ol) AS ?olabel) WHERE {
      ${inGraph(`<${iri}> ?p ?o`)}
      OPTIONAL { ?p rdfs:label ?pl }
      OPTIONAL { ?o rdfs:label ?ol }
    } GROUP BY ?p ?o ORDER BY ?p LIMIT ${FACT_CAP + 1}`),
    sparql(`${PREFIX}SELECT ?p ?b ?p2 ?o2 (SAMPLE(?p2l) AS ?p2label) (SAMPLE(?o2l) AS ?o2label) WHERE {
      ${inGraph(`<${iri}> ?p ?b . ?b ?p2 ?o2 . FILTER(isBlank(?b))`)}
      OPTIONAL { ?p2 rdfs:label ?p2l }
      OPTIONAL { ?o2 rdfs:label ?o2l }
    } GROUP BY ?p ?b ?p2 ?o2 ORDER BY ?p ?b ?p2 LIMIT 300`),
    sparql(linksQuery(iri, LINK_CAP, false)),
  ]);
}

async function loadDetail(iri, pane) {
  const inGraphs = namedGraphs;
  const [factRows, nestedRows, incomingRows] = await detailRows(iri);
  if (!factRows.length && !incomingRows.length && inGraphs) {
    if (!graphsKnown) {
      const anyGraph = await sparql('SELECT ?g WHERE { GRAPH ?g { ?s ?p ?o } } LIMIT 1');
      graphsKnown = true;
      if (!anyGraph.length) namedGraphs = false;
    }
    if (!namedGraphs) return loadDetail(iri, pane);
  }
  const graphOf = r => r.g ? r.g.value : '';
  if (!pane.isConnected) return;
  const term = t => `${t.type}|${t.value}|${t['xml:lang'] || ''}|${t.datatype || ''}`;
  const together = key => (a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0;
  const facts = factRows.slice(0, FACT_CAP);
  const incoming = incomingRows.slice(0, LINK_CAP)
    .sort(together(r => `${r.p.value}|${term(r.s)}|${graphOf(r)}`));
  const moreFacts = factRows.length > FACT_CAP;
  const moreLinks = incomingRows.length > LINK_CAP;
  const linkGraphs = new Set(incoming.map(graphOf).filter(Boolean)).size;
  const nestedGroups = new Map();
  for (const r of nestedRows) {
    const key = `${r.p.value}|${r.b.value}`;
    if (!nestedGroups.has(key)) nestedGroups.set(key, []);
    nestedGroups.get(key).push(r);
  }
  const seenUnder = {};
  for (const row of facts) {
    row.inner = [];
    if (row.o.type !== 'bnode') continue;
    const under = row.p.value;
    const exact = nestedGroups.get(`${under}|${row.o.value}`);
    if (exact) { row.inner = exact; continue; }
    const groups = [...nestedGroups.entries()].filter(([k]) => k.startsWith(under + '|')).map(([, v]) => v);
    const n = seenUnder[under] = (seenUnder[under] || 0) + 1;
    row.inner = groups[n - 1] || [];
  }
  const propCell = r =>
    `<td class="p" title="${esc(r.p.value)}">${esc(r.plabel ? r.plabel.value : localName(r.p.value))}</td>`;
  const iriLink = (v, label) => {
    const app = appLink(v);
    if (app) {
      return `<a class="opens" href="${esc(app.url)}"
                 title="Open in ${esc(app.label)}: ${esc(v)}">${esc(label || short(v))}</a>`
        + followLink(v);
    }
    return `<a href="#" data-iri="${esc(v)}" title="${esc(v)}">${esc(label || short(v))}</a>`
      + followLink(v);
  };
  const innerHtml = rows => rows.map(r => {
    const k = esc(r.p2label ? r.p2label.value : localName(r.p2.value));
    let v = r.o2.type === 'uri' ? iriLink(r.o2.value, r.o2label && r.o2label.value) : esc(r.o2.value);
    if (r.p2.value === 'http://rdfs.org/ns/void#class' && r.o2.type === 'uri')
      v += `<a href="#" class="lst" data-cls="${esc(r.o2.value)}" title="List every entity of this class">list</a>`;
    return `<span class="kv"><span class="k">${k}</span>${v}</span>`;
  }).join('<span class="sep"> · </span>');
  const objCell = r => r.o.type === 'uri'
    ? iriLink(r.o.value, r.olabel && r.olabel.value)
    : r.o.type === 'bnode'
      ? (r.inner.length ? innerHtml(r.inner) : '<span class="t">[blank node]</span>')
      : esc(r.o.value);
  const prefs = facts.filter(r => r.p.value === SKOS_NS + 'prefLabel');
  const labelRow = facts.find(r => r.p.value === 'http://www.w3.org/2000/01/rdf-schema#label') ||
    LANGS.map(l => prefs.find(r => (r.o['xml:lang'] || '').toLowerCase().split('-')[0] === l)).find(Boolean) ||
    prefs[0];
  const heading = labelRow ? labelRow.o.value : localName(iri);
  pane.querySelector('.spine').textContent = heading;
  pane.querySelector('.body').innerHTML =
    `<h2>Entity</h2>` +
    `<p class="ehead">${esc(heading)}</p>` +
    `<p><code title="${esc(iri)}">${esc(short(iri))}</code>${copyButton(iri)}${followLink(iri)}</p>` +
    `<p class="t">${moreFacts || moreLinks ? 'more than ' : ''}${facts.length + incoming.length} facts` +
    (incoming.length ? `, ${moreLinks ? `more than ${LINK_CAP}` : incoming.length} of them linking here` +
      (linkGraphs ? ` from ${linkGraphs} graph${linkGraphs === 1 ? '' : 's'}` : '') : '') +
    (moreFacts || moreLinks ? '; the rest are not shown' : '') + `</p>` +
    `<table>` + facts.map(r =>
      `<tr>${propCell(r)}<td>${objCell(r)}</td></tr>`).join('') +
    `</table>` +
    (incoming.length ? `<h2>Linked from</h2><table class="links">` + incoming.map(linkRow).join('') +
      `</table>` + (moreLinks
        ? `<button class="clear" data-morelinks="${LINK_CAP}" title="The next ${LINK_CAP} links to this entity">show ${LINK_CAP} more</button>`
        : '') : '');
}

async function refresh(listOnly = false) {
  const s = document.getElementById('status');
  const current = take('refresh');
  if (!listOnly) facetsDue = true;
  try {
    s.textContent = 'querying…';
    partial = false;
    state.offset = 0;
    await loadSettings();
    if (!await ensureSearch() || !current()) return;
    await Promise.all([listOnly ? null : loadFacets(take('facets')), loadResults(false, take('results'))]);
    if (!current()) return;
    const scan = searchApi === false && state.text
      ? (FORCE_SPARQL ? ' (forced SPARQL scan)'
        : textIndex && textQuery(state.text) ? ' (Virtuoso text index; matches words, not substrings)'
        : ' (no search sidecar; SPARQL scan)')
      : '';
    s.textContent = connectedText(scan);
  } catch (e) {
    if (!textFlat && GIVEN_GRAPHS.length && /SQ156/.test(e.message)) { textFlat = true; return refresh(listOnly); }
    if (current()) fail(e);
  }
}

function connectedText(scan = '') {
  const cut = partial ? ' – the endpoint cut some answers short; counts may be incomplete' : '';
  const scope = GIVEN_GRAPHS.length
    ? `, ${GIVEN_GRAPHS.length} graph${GIVEN_GRAPHS.length === 1 ? '' : 's'} only` : '';
  return `connected to ${ENDPOINT}${scope}${scan}${cut}`;
}

document.addEventListener('click', e => {
  if (e.target.closest('a.ext, a.app, a.opens')) return;
  const copy = e.target.closest('button.copy');
  if (copy) {
    copyText(copy.id === 'voidcopy' ? scopeVoid() : copy.dataset.copy).then(() => {
      copy.classList.add('done');
      copy.textContent = '✓';
      setTimeout(() => { copy.classList.remove('done'); copy.innerHTML = COPY_ICON; }, 1200);
    });
    return;
  }
  if (e.target.id === 'more') {
    state.offset += PAGE;
    loadResults(true, take('results')).catch(fail);
    return;
  }
  if (e.target.id === 'sortd') {
    state.sort = state.sort === 'desc' ? 'asc' : state.sort === 'asc' ? null : 'desc';
    state.offset = 0;
    loadResults(false, take('results')).catch(fail);
    return;
  }
  if (e.target.closest('#facets.folded')) { fold(false); setTarget('scheme'); return; }
  const clear = e.target.closest('[data-clear]');
  if (clear && clear.dataset.clear === 'scheme') { clearScheme(); return; }
  if (clear) { state[clear.dataset.clear] = null; selectionChanged(); renderFacets(); refresh(); return; }
  const seek = e.target.closest('button.seek');
  if (seek) { setTarget(seek.dataset.seek); qEl.focus(); return; }
  if (e.target.id === 'catlink') { if (CATALOGUE) openEntity(CATALOGUE, null); return; }
  if (e.target.id === 'panes') { setStacked(!stacked); return; }
  if (e.target.id === 'skosbtn') { setSkos(!sk.on); return; }
  const group = e.target.closest('[data-group]');
  if (group) {
    sk.groups.has(group.dataset.group) ? sk.groups.delete(group.dataset.group) : sk.groups.add(group.dataset.group);
    renderSchemes();
    return;
  }
  const scheme = e.target.closest('[data-scheme]');
  if (scheme) { selectScheme(scheme.dataset.scheme); return; }
  const chev = e.target.closest('button.chev[data-node]');
  if (chev) { toggleNode(chev.dataset.node).catch(fail); return; }
  const moreKids = e.target.closest('button[data-more]');
  if (moreKids) {
    const parent = moreKids.dataset.more || null, e = sk.scheme, current = () => sk.scheme === e;
    const at = parent ? (node(parent).kids || []).length : (sk.roots || []).length;
    moreKids.disabled = true;
    loadLevel(sk.scheme, parent, at, current).then(() => { if (current()) renderConcepts(); }, fail);
    return;
  }
  if (e.target.id === 'treeshut') { sk.open.clear(); renderConcepts(); return; }
  if (e.target.id === 'treeall' || e.target.id === 'treeopen') {
    const expand = e.target.id === 'treeopen';
    wholeScheme().then(ok => {
      if (!ok) return;
      if (expand) for (const [iri, n] of sk.nodes) if (n.kids && n.kids.length) sk.open.add(iri);
      renderConcepts();
    }, fail);
    return;
  }
  const spine = e.target.closest('.spine');
  if (spine) { reveal(spine.parentElement); return; }
  if (e.target === results && results.classList.contains('covered')) {
    strip.scrollTo({ left: 0, behavior: 'smooth' });
    setTarget('list');
    return;
  }
  const cls = e.target.closest('[data-cls]');
  if (cls) {
    e.preventDefault();
    clearTimeout(timer); timer = 0;
    setTarget('list');
    state.cls = cls.dataset.cls; state.graph = null; state.text = ''; state.within = false; state.sort = null;
    qEl.value = '';
    refresh();
    return;
  }
  const pin = e.target.closest('button.pin');
  if (pin) { togglePin(pin.dataset.pin); return; }
  if (e.target.id === 'pinreset') { resetPins(); renderFacets(); return; }
  if (e.target.id === 'allcls') { allClasses = true; loadFacets(take('facets')).catch(fail); return; }
  if (e.target.id === 'pincopy') {
    const b = e.target;
    copyText(pinsTurtle()).then(() => {
      b.textContent = 'copied';
      setTimeout(() => { b.textContent = 'copy as Turtle'; }, 1200);
    });
    return;
  }
  const more = e.target.closest('button[data-morelinks]');
  if (more) { showMoreLinks(more); return; }
  const f = e.target.closest('.facet');
  if (f) { state[f.dataset.key] = state[f.dataset.key] === f.dataset.v ? null : f.dataset.v;
           selectionChanged(); renderFacets(); refresh(); return; }
  const link = e.target.closest('[data-iri]');
  if (link) { e.preventDefault(); openEntity(link.dataset.iri, link.closest('.pane')); }
});
document.getElementById('ep').addEventListener('change', e => {
  const url = e.target.value;
  remember(REMEMBERED, url);
  const params = new URLSearchParams(location.search);
  params.set('endpoint', url);
  location.search = params.toString();
});
const facetsEl = document.getElementById('facets');
let dragged = null;
const dropMarks = () => facetsEl.querySelectorAll('.drop-before, .drop-after')
  .forEach(x => x.classList.remove('drop-before', 'drop-after'));
facetsEl.addEventListener('dragstart', e => {
  const f = e.target.closest('.facet.pinned');
  if (!f) return;
  dragged = f.dataset.v;
  f.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragged);
});
facetsEl.addEventListener('dragover', e => {
  const f = e.target.closest('.facet.pinned');
  if (!dragged || !f) return;
  e.preventDefault();
  const r = f.getBoundingClientRect();
  dropMarks();
  if (f.dataset.v !== dragged)
    f.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
});
facetsEl.addEventListener('drop', e => {
  const f = e.target.closest('.facet.pinned');
  if (!dragged || !f) return;
  e.preventDefault();
  if (f.dataset.v !== dragged) movePin(dragged, f.dataset.v, f.classList.contains('drop-after'));
});
facetsEl.addEventListener('dragend', () => { dragged = null; renderFacets(); });
facetsEl.addEventListener('keydown', e => {
  const f = e.target.closest('.facet.pinned');
  if (!f || e.target !== f) return;
  if (e.key === 'Enter') { f.click(); return; }
  if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const list = pinned(), v = f.dataset.v, i = list.indexOf(v);
  const j = i + (e.key === 'ArrowUp' ? -1 : 1);
  if (j < 0 || j >= list.length) return;
  movePin(v, list[j], e.key === 'ArrowDown');
  [...facetsEl.querySelectorAll('.facet.pinned')].find(x => x.dataset.v === v)?.focus();
});

const qEl = document.getElementById('q');
let target = 'list';
const sectionFilter = {cls: '', graph: '', scheme: ''};
let timer = 0;

qEl.addEventListener('input', () => {
  clearTimeout(timer);
  if (target !== 'list') { filterSection(qEl.value); return; }
  timer = setTimeout(() => { timer = 0; search(qEl.value.trim()); }, 300);
});
qEl.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!qEl.value) { setTarget('list'); return; }
  qEl.value = '';
  if (target !== 'list') { filterSection(''); return; }
  clearTimeout(timer); timer = 0;
  search('');
});

function search(text) {
  if (sk.on) {
    if (text === sk.text) return;
    sk.text = text;
    skosSearch();
    return;
  }
  if (text === state.text) return;
  const counted = state.text && !state.within;
  if (!text) state.within = false;
  else if (!state.text) state.within = !!(state.cls || state.graph);
  state.text = text;
  refresh(!facetsDue && !counted && !(text && !state.within));
}

function filterSection(value) {
  sectionFilter[target] = value.trim();
  if (target === 'cls' && sectionFilter.cls && facetRows.more) {
    allClasses = true;
    loadFacets(take('facets')).catch(fail);
  }
  renderFacets();
}

function setTarget(t) {
  if (t === target) return;
  if (timer) { clearTimeout(timer); timer = 0; search(qEl.value.trim()); }
  const left = target;
  target = t;
  qEl.value = t !== 'list' ? sectionFilter[t] : sk.on ? sk.text : state.text;
  if (left !== 'list' && sectionFilter[left]) { sectionFilter[left] = ''; renderFacets(); }
  else searchPrompt();
}

function selectionChanged() {
  if (!state.cls && !state.graph) state.within = false;
  setTarget('list');
}

const SEEK_ICON = '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>';
const SEEK_NAMES = {cls: 'the Class list', graph: 'the Graph list', scheme: 'the Scheme list',
                    list: 'the entities listed'};
const lit = key => key === target &&
  (key !== 'list' || (sk.on ? !!sk.scheme : !!(state.cls || state.graph)));
const seekButton = key => `<button class="seek${lit(key) ? ' on' : ''}" data-seek="${key}" ` +
  `title="Search ${SEEK_NAMES[key]}" aria-label="Search ${SEEK_NAMES[key]}">${SEEK_ICON}</button>`;

function searchPrompt() {
  qEl.placeholder = `Search ${target === 'cls' ? 'classes' : target === 'graph' ? 'graphs'
    : target === 'scheme' ? 'schemes'
    : !sk.on ? listName() : sk.scheme ? `concepts in ${schemeName(sk.scheme)}` : 'concepts'}`;
  qEl.title = target !== 'list' ? `Searches the names in ${SEEK_NAMES[target]}`
    : sk.on ? 'Searches the labels and notations of the concepts' : 'Searches every string value an entity carries, not only labels';
  for (const b of document.querySelectorAll('button.seek')) b.classList.toggle('on', lit(b.dataset.seek));
}

function listName() {
  const c = state.cls && plural(facetName('cls', state.cls));
  const g = state.graph && facetName('graph', state.graph).value;
  return c ? (g ? `${c} in ${g}` : c) : g ? `in ${g}` : 'everything';
}

function facetName(k, v) {
  const b = k === 'cls' ? [...facetRows.pins, ...facetRows.classes].find(r => r.c.value === v)
                        : facetRows.graphs.find(r => r.g.value === v);
  const l = b && (k === 'cls' ? b.label : b.title);
  return l ? {value: l.value, lang: l['xml:lang'] || ''} : {value: localName(v), lang: ''};
}

const IRREGULAR = {person: 'people', man: 'men', woman: 'women', child: 'children', datum: 'data',
  criterion: 'criteria', phenomenon: 'phenomena', medium: 'media'};
const UNCOUNTED = /(?:data|equipment|evidence|feedback|information|knowledge|music|news|research|series|software|species|staff)$/i;
function plural({value, lang}) {
  if (lang && !/^en(-|$)/i.test(lang)) return value;
  const [, head, tail] = value.match(/^(.+?)((?:\s+(?:of|for|in|on|at|by|with|from)\s.*)?)$/i);
  const [, before, word] = head.match(/^(.*?)(\S+)$/);
  if (!/^\p{L}+$/u.test(word)) return value;
  const irregular = IRREGULAR[word.toLowerCase()];
  const many = irregular ? word[0] + irregular.slice(1)
    : UNCOUNTED.test(word) ? word
    : /^\p{Lu}{2,}$/u.test(word) ? word + 's'
    : /is$/i.test(word) ? word.slice(0, -2) + 'es'
    : /[^aeiou]y$/i.test(word) ? word.slice(0, -1) + 'ies'
    : /(?:ss|[au]s|x|z|ch|sh)$/i.test(word) ? word + 'es'
    : /s$/i.test(word) ? word
    : word + 's';
  const name = before + many + tail;
  return /^\p{Lu}\p{Ll}+(?:\s+[^\p{Lu}\s]\S*)*$/u.test(value) ? name[0].toLowerCase() + name.slice(1) : name;
}

const SKOS_NS = 'http://www.w3.org/2004/02/skos/core#';
const SKOS_PREFIX = 'PREFIX skos: <http://www.w3.org/2004/02/skos/core#>\n' +
  'PREFIX skosxl: <http://www.w3.org/2008/05/skos-xl#>\n';
const SKOS_CLASSES = new Set([SKOS_NS + 'Concept', SKOS_NS + 'ConceptScheme']);
const XL_PATH = 'skosxl:prefLabel/skosxl:literalForm';
const SCHEME_CAP = 500;
const DRAW_CAP = 5000;
const LANG = ((new URLSearchParams(location.search).get('lang') || navigator.language || 'en')
  .toLowerCase().match(/^[a-z]{2,3}/) || ['en'])[0];
const LANGS = LANG === 'en' ? ['en'] : [LANG, 'en'];
const skosBtn = document.getElementById('skosbtn');
let wantScheme = new URLSearchParams(location.search).get('scheme');
const sk = {
  on: new URLSearchParams(location.search).get('view') === 'skos',
  byIri: new Map(),
  top: null,
  groups: new Set(),
  scheme: null,
  xl: false,
  nodes: new Map(),
  roots: null, rootsMore: false,
  whole: false,
  open: new Set(),
  text: '',
  found: null,
  hits: null,
};

const labelOpts = (v, path = 'skos:prefLabel') =>
  LANGS.map((l, i) => `OPTIONAL { ?${v} ${path} ?${v}L${i} FILTER(langMatches(lang(?${v}L${i}), "${l}")) }`)
    .concat(`OPTIONAL { ?${v} ${path} ?${v}La }`).join('\n    ');
const labelOf = v => `COALESCE(${LANGS.map((l, i) => `SAMPLE(?${v}L${i})`).join(', ')}, SAMPLE(?${v}La))`;

function inSchemeGraphs(e, pattern) {
  const g = e.graphs.includes(e.iri) ? [e.iri] : e.graphs;
  if (!g.length) return pattern;
  if (g.length === 1) return `GRAPH <${g[0]}> { ${pattern} }`;
  return `VALUES ?gS { ${g.map(x => `<${x}>`).join(' ')} }\n  GRAPH ?gS { ${pattern} }`;
}

const schemeName = e => e.label ? e.label.value : localName(e.iri);
const nodeName = iri => { const n = sk.nodes.get(iri); return n && n.label ? n.label.value : localName(iri); };
const byNodeName = (a, b) => nodeName(a).localeCompare(nodeName(b), LANG);
function node(iri) {
  if (!sk.nodes.has(iri)) sk.nodes.set(iri, {label: null, notation: null, kids: null, more: false, count: 0});
  return sk.nodes.get(iri);
}

async function loadSchemes() {
  const ask = inGraph => sparql(`${PREFIX}${SKOS_PREFIX}SELECT ?s ?g (${labelOf('s')} AS ?label) WHERE {
  ${inGraph ? `${GIVEN_GRAPHS.length ? `VALUES ?g { ${graphList} }\n  ` : ''}GRAPH ?g { ?s a skos:ConceptScheme .
    ${labelOpts('s')} }` : `?s a skos:ConceptScheme .\n  ${labelOpts('s')}`}
} GROUP BY ?s ?g`);
  let rows = await ask(true);
  if (!rows.length && !GIVEN_GRAPHS.length) rows = await ask(false);
  const by = new Map();
  for (const b of rows) {
    if (b.s.type !== 'uri' || !iriSafe(b.s.value)) continue;
    const e = by.get(b.s.value) || {iri: b.s.value, graphs: [], label: null, n: null, nested: []};
    if (b.g && iriSafe(b.g.value) && !e.graphs.includes(b.g.value)) e.graphs.push(b.g.value);
    if (b.label && !e.label) e.label = b.label;
    by.set(e.iri, e);
  }
  for (const e of by.values()) {
    if (e.graphs.includes(e.iri)) continue;
    const host = e.graphs.map(g => by.get(g)).find(h => h && h.graphs.includes(h.iri));
    if (host) { host.nested.push(e); e.host = host; }
  }
  sk.byIri = by;
  sk.top = [...by.values()].filter(e => !e.host);
}

async function loadSchemeCounts(current) {
  const inGraphs = [...sk.byIri.values()].some(e => e.graphs.length);
  const rows = await sparql(`${SKOS_PREFIX}SELECT ?s (COUNT(DISTINCT ?c) AS ?n) WHERE {
  ${inGraphs ? `${GIVEN_GRAPHS.length ? `VALUES ?g { ${graphList} }\n  ` : ''}GRAPH ?g { ?s a skos:ConceptScheme . ?c skos:inScheme ?s }`
             : '?s a skos:ConceptScheme . ?c skos:inScheme ?s .'}
} GROUP BY ?s`);
  if (!current()) return;
  for (const e of sk.byIri.values()) e.n = 0;
  for (const b of rows) { const e = sk.byIri.get(b.s.value); if (e) e.n = Number(b.n.value); }
  renderSchemes();
}

async function loadSchemeTitles(current) {
  const nameless = [...sk.byIri.values()].filter(e => !e.label);
  if (!nameless.length) return;
  const rows = await sparql(`${PREFIX}${SKOS_PREFIX}SELECT ?s ?t WHERE {
  VALUES ?s { ${nameless.map(e => `<${e.iri}>`).join(' ')} }
  ?s <http://purl.org/dc/terms/title>|rdfs:label|(${XL_PATH}) ?t .
}`);
  if (!current()) return;
  const titles = new Map();
  for (const b of rows) {
    if (!titles.has(b.s.value)) titles.set(b.s.value, []);
    titles.get(b.s.value).push(b.t);
  }
  for (const [s, ts] of titles) { const e = sk.byIri.get(s); if (e && !e.label) e.label = pickLabel(ts); }
  renderSchemes();
}

function renderSchemes() {
  const f = target === 'scheme' && sectionFilter.scheme.toLowerCase();
  const hit = e => !f || schemeName(e).toLowerCase().includes(f) || e.iri.toLowerCase().includes(f);
  const byName = (a, b) => schemeName(a).localeCompare(schemeName(b), LANG);
  const row = (e, depth) => {
    const kids = e.nested.filter(hit);
    if (!hit(e) && !kids.length) return '';
    const open = f ? kids.length > 0 : sk.groups.has(e.iri);
    const chev = !e.nested.length ? '' :
      `<button class="chev" data-group="${esc(e.iri)}" aria-expanded="${open}"
               title="${open ? 'Hide' : 'Show'} the ${e.nested.length} schemes in its graph">${open ? '▾' : '▸'}</button>`;
    return `<div class="facet${sk.scheme === e ? ' on' : ''}" data-scheme="${esc(e.iri)}" title="${esc(e.iri)}"
                 style="padding-left:${6 + depth * 16}px"><span>${chev}${esc(schemeName(e))}</span><span class="n">${e.n ?? ''}</span></div>` +
      (open ? (f ? kids : e.nested).slice().sort(byName).map(k => row(k, depth + 1)).join('') : '');
  };
  const list = sk.top ? sk.top.slice().sort(byName).map(e => row(e, 0)).join('') : '';
  facetsEl.innerHTML =
    `<h2>Scheme${seekButton('scheme')} ${sk.scheme ? '<button class="clear" data-clear="scheme">clear</button>' : ''}</h2>` +
    (sk.top === null ? '<p class="t">loading…</p>'
      : list || `<p class="t">${f ? `No scheme matches “${esc(sectionFilter.scheme)}”.` : 'This store holds no concept scheme.'}</p>`);
  facetsEl.dataset.spine = sk.scheme ? schemeName(sk.scheme) : 'Schemes';
  searchPrompt();
}

function fold(on) {
  facetsEl.classList.toggle('folded', on && !phone.matches);
  coverSoon();
}

function selectScheme(iri) {
  const e = sk.byIri.get(iri);
  if (!e) return;
  if (sk.scheme === e) { clearScheme(); return; }
  Object.assign(sk, {scheme: e, xl: false, nodes: new Map(), roots: null, rootsMore: false,
                     whole: false, open: new Set(), found: null, hits: null});
  setTarget('list');
  renderSchemes();
  fold(true);
  syncUrl();
  loadTree(take('tree')).catch(fail);
}

function clearScheme() {
  take('tree');
  Object.assign(sk, {scheme: null, nodes: new Map(), roots: null, found: null, hits: null});
  fold(false);
  renderSchemes();
  syncUrl();
  if (sk.text) skosSearch(); else renderConcepts();
}

async function loadTree(current) {
  const e = sk.scheme;
  renderConcepts('loading…');
  if (e.n !== null && e.n <= SCHEME_CAP) await loadWhole(e, current);
  else await loadLevel(e, null, 0, current);
  if (!current()) return;
  if (sk.text) await searchScheme(current);
  else renderConcepts();
}

async function loadWhole(e, current) {
  const ask = path => sparql(`${SKOS_PREFIX}SELECT ?c ?p (${labelOf('c')} AS ?label) (SAMPLE(?nt0) AS ?notation) (SAMPLE(?nts0) AS ?nts) WHERE {
  ${inSchemeGraphs(e, `?c skos:inScheme <${e.iri}> .
    OPTIONAL { { ?c skos:broader ?p } UNION { ?p skos:narrower ?c } }
    ${labelOpts('c', path)}`)}
  OPTIONAL { SELECT ?c (SAMPLE(?nt) AS ?nt0) (COUNT(DISTINCT ?nt) AS ?nts0) WHERE {
    ${inSchemeGraphs(e, `?c skos:inScheme <${e.iri}> ; skos:notation ?nt`)} } GROUP BY ?c }
} GROUP BY ?c ?p`);
  let rows = await ask(sk.xl ? XL_PATH : 'skos:prefLabel');
  if (!sk.xl && rows.length && !rows.some(b => b.label)) { sk.xl = true; rows = await ask(XL_PATH); }
  if (!current()) return;
  const inScheme = new Set(rows.map(b => b.c.value));
  for (const c of inScheme) { const n = node(c); n.kids = []; n.more = false; }
  const parented = new Set();
  for (const b of rows) {
    const n = node(b.c.value);
    if (b.label) n.label = b.label;
    if (b.notation && b.nts && b.nts.value === '1') n.notation = b.notation.value;
    if (b.p && b.p.value !== b.c.value && inScheme.has(b.p.value)) {
      const kids = node(b.p.value).kids;
      if (!kids.includes(b.c.value)) kids.push(b.c.value);
      parented.add(b.c.value);
    }
  }
  for (const c of inScheme) { const n = node(c); n.kids.sort(byNodeName); n.count = n.kids.length; }
  sk.roots = [...inScheme].filter(c => !parented.has(c)).sort(byNodeName);
  sk.rootsMore = false;
  sk.whole = true;
}

async function loadLevel(e, parent, offset, current) {
  const ask = (pick, path) => sparql(`${SKOS_PREFIX}SELECT ?c ?label ?kids WHERE {
  { SELECT ?c (${labelOf('c')} AS ?label) WHERE {
      ${inSchemeGraphs(e, `${pick}\n    ${labelOpts('c', path)}`)}
    } GROUP BY ?c }
  OPTIONAL { SELECT ?c (COUNT(DISTINCT ?k) AS ?kids) WHERE {
      ${inSchemeGraphs(e, '{ ?k skos:broader ?c } UNION { ?c skos:narrower ?k }')} } GROUP BY ?c }
} ORDER BY LCASE(STR(?label)) ?c LIMIT ${PAGE + 1} OFFSET ${offset}`);
  const top = `{ ?c skos:topConceptOf <${e.iri}> } UNION { <${e.iri}> skos:hasTopConcept ?c }`;
  const loose = `?c skos:inScheme <${e.iri}> FILTER NOT EXISTS { ?c skos:broader ?b . ?b skos:inScheme <${e.iri}> }`;
  const pick = parent ? `{ ?c skos:broader <${parent}> } UNION { <${parent}> skos:narrower ?c }`
    : e.loose ? loose : top;
  let rows = await ask(pick, sk.xl ? XL_PATH : 'skos:prefLabel');
  if (!parent && !offset && !rows.length && !e.loose) { e.loose = true; rows = await ask(loose, sk.xl ? XL_PATH : 'skos:prefLabel'); }
  if (!sk.xl && rows.length && !rows.some(b => b.label)) {
    sk.xl = true;
    rows = await ask(parent ? pick : e.loose ? loose : top, XL_PATH);
  }
  if (!current()) return;
  const list = rows.slice(0, PAGE).map(b => {
    const n = node(b.c.value);
    if (b.label) n.label = b.label;
    n.count = b.kids ? Number(b.kids.value) : 0;
    return b.c.value;
  });
  const more = rows.length > PAGE;
  if (parent) { const p = node(parent); p.kids = (offset && p.kids ? p.kids : []).concat(list); p.more = more; }
  else { sk.roots = (offset && sk.roots ? sk.roots : []).concat(list); sk.rootsMore = more; }
}

function renderConcepts(note) {
  if (!sk.on) return;
  const e = sk.scheme;
  const head = title => `<h2><span>${title}${seekButton('list')}</span>${e && !note && !sk.found ? `<span class="tools">${
    sk.whole ? '' : `<button class="clear" id="treeall" title="Load every concept of the scheme">show all</button>`}
    <button class="clear" id="treeopen">expand all</button>
    <button class="clear" id="treeshut">collapse all</button></span>` : ''}</h2>`;
  const sought = sk.text ? ` matching <span class="typed">“${esc(sk.text)}”</span>` : '';
  if (!e) {
    results.innerHTML = head(`Concepts${sought}`) + (note ? `<p class="t">${note}</p>`
      : sk.hits ? (sk.hits.length ? sk.hits.map(h => rowHtml(h.iri, h.label,
          h.scheme ? schemeName(h.scheme) : '')).join('') : '<p class="t">No concept matches.</p>')
      : '<p class="t">Pick a scheme on the left, or search every scheme’s concepts.</p>');
    searchPrompt();
    return;
  }
  const count = e.n !== null ? ` (${e.n})` : '';
  if (note) { results.innerHTML = head(`Concepts in ${esc(schemeName(e))}${count}`) + `<p class="t">${note}</p>`; return; }
  const kidsOf = iri => sk.found ? sk.found.kids.get(iri) || [] : node(iri).kids || [];
  let drawn = 0;
  const out = [];
  const walk = (iris, depth, above) => {
    for (const iri of iris) {
      if (drawn >= DRAW_CAP) return;
      const n = node(iri);
      const kids = kidsOf(iri);
      const has = sk.found ? kids.length > 0 : n.kids ? n.kids.length > 0 || n.more : n.count > 0;
      const open = has && !above.has(iri) && (sk.found ? true : sk.open.has(iri));
      const chev = has ? `<button class="chev" data-node="${esc(iri)}" aria-expanded="${open}"
                                  aria-label="${open ? 'Collapse' : 'Expand'}">${open ? '▾' : '▸'}</button>` : '<span class="chev"></span>';
      out.push(`<div class="node${sk.found && sk.found.hits.has(iri) ? ' hit' : ''}" style="--d:${depth}">${chev}` +
        `<a href="#" data-iri="${esc(iri)}" title="${esc(iri)}">${n.notation ? `<span class="nt">${esc(n.notation)}</span> ` : ''}` +
        `${esc(nodeName(iri))}</a>${!sk.found && n.count ? `<span class="n">${n.count}</span>` : ''}</div>`);
      drawn++;
      if (!open) continue;
      if (!sk.found && !n.kids) { out.push(`<div class="node" style="--d:${depth + 1}"><span class="t">loading…</span></div>`); continue; }
      above.add(iri);
      walk(kids, depth + 1, above);
      above.delete(iri);
      if (!sk.found && n.more) out.push(`<div class="node" style="--d:${depth + 1}"><button class="clear" data-more="${esc(iri)}">show ${PAGE} more</button></div>`);
    }
  };
  walk(sk.found ? sk.found.roots : sk.roots || [], 0, new Set());
  if (!sk.found && sk.rootsMore) out.push(`<div class="node"><button class="clear" data-more="">show ${PAGE} more</button></div>`);
  const capped = drawn >= DRAW_CAP ? `<p class="t">The first ${DRAW_CAP} rows; collapse a branch, or search, to see the rest.</p>` : '';
  results.innerHTML = head(`Concepts in ${esc(schemeName(e))}${count}${sought}`) +
    (out.length ? `<div class="tree">${out.join('')}</div>` + capped
      : `<p class="t">${sk.found ? 'No concept matches.' : 'This scheme holds no concept in its graph.'}</p>`);
  searchPrompt();
}

async function toggleNode(iri) {
  if (sk.open.has(iri)) { sk.open.delete(iri); renderConcepts(); return; }
  sk.open.add(iri);
  const n = node(iri);
  renderConcepts();
  if (!n.kids) {
    const e = sk.scheme, current = () => sk.scheme === e;
    await loadLevel(e, iri, 0, current);
    if (current()) renderConcepts();
  }
}

async function wholeScheme() {
  if (sk.whole) return true;
  const current = take('tree');
  renderConcepts('loading every concept of the scheme…');
  await loadWhole(sk.scheme, current);
  return current();
}

function skosSearch() {
  const current = take('skossearch');
  return (sk.scheme ? searchScheme(current) : searchAllSchemes(current)).catch(e => { if (current()) fail(e); });
}

const knownWord = () => ([...sk.byIri.values(), ...sk.nodes.values()].map(e => e.label ? e.label.value : '')
  .join(' ').match(/[A-Za-z]{4,}/) || [])[0];

function labelMatch(text, xl) {
  const bind = xl ? 'VALUES ?lp { skosxl:prefLabel skosxl:altLabel } ?m ?lp ?lx . ?lx skosxl:literalForm ?l .'
                  : 'VALUES ?lp { skos:prefLabel skos:altLabel } ?m ?lp ?l .';
  const langs = LANGS.map(l => `langMatches(lang(?l), "${l}")`).concat('lang(?l) = ""').join(' || ');
  const words = textIndex && textQuery(text);
  if (words) return { bind, index: `?l bif:contains '${words}' .`, filter: `FILTER(${langs})` };
  const t = text.replace(/["\\]/g, '\\$&');
  return { bind, index: '', filter: `FILTER((${langs}) && CONTAINS(LCASE(STR(?l)), LCASE("${t}")))` };
}

async function searchScheme(current) {
  const e = sk.scheme;
  if (!sk.text) { sk.found = null; renderConcepts(); return; }
  if (sk.whole) {
    const t = sk.text.toLowerCase();
    const parents = new Map();
    for (const [iri, n] of sk.nodes) for (const k of n.kids || []) {
      if (!parents.has(k)) parents.set(k, []);
      parents.get(k).push(iri);
    }
    const hits = new Set([...sk.nodes.keys()].filter(iri => {
      const n = sk.nodes.get(iri);
      return nodeName(iri).toLowerCase().includes(t) || (n.notation || '').toLowerCase().includes(t);
    }));
    sk.found = keep(hits, iri => parents.get(iri) || []);
    renderConcepts();
    return;
  }
  renderConcepts('searching…');
  await probeTextIndex(knownWord());
  const m = labelMatch(sk.text, sk.xl);
  const rows = await sparql(`${SKOS_PREFIX}SELECT DISTINCT ?m ?a ?p WHERE {
  ${m.index ? `${m.bind} ${m.index} ${m.filter}\n  ` : ''}${inSchemeGraphs(e,
    `?m skos:inScheme <${e.iri}> .${m.index ? '' : ` ${m.bind} ${m.filter}`}
    ?m skos:broader* ?a .
    OPTIONAL { ?a skos:broader ?p }`)}
} LIMIT 1000`);
  if (!current()) return;
  const hits = new Set(), parents = new Map();
  for (const b of rows) {
    if (!iriSafe(b.m.value) || !iriSafe(b.a.value)) continue;
    hits.add(b.m.value);
    if (!parents.has(b.a.value)) parents.set(b.a.value, []);
    if (b.p && b.p.value !== b.a.value && iriSafe(b.p.value)) parents.get(b.a.value).push(b.p.value);
  }
  const unnamed = [...parents.keys()].filter(iri => !node(iri).label);
  if (unnamed.length) {
    const labels = await sparql(`${SKOS_PREFIX}SELECT ?a ?l WHERE {
  VALUES ?a { ${unnamed.map(a => `<${a}>`).join(' ')} }
  ${inSchemeGraphs(e, `?a ${sk.xl ? XL_PATH : 'skos:prefLabel'} ?l`)}
}`);
    if (!current()) return;
    const byConcept = new Map();
    for (const b of labels) {
      if (!byConcept.has(b.a.value)) byConcept.set(b.a.value, []);
      byConcept.get(b.a.value).push(b.l);
    }
    for (const [iri, ls] of byConcept) node(iri).label = pickLabel(ls);
  }
  sk.found = keep(hits, iri => (parents.get(iri) || []).filter(p => parents.has(p)));
  renderConcepts();
}

const pickLabel = ls => LANGS.map(l => ls.find(t => (t['xml:lang'] || '').toLowerCase().split('-')[0] === l))
  .find(Boolean) || ls[0];

function keep(hits, parentsOf) {
  const kept = new Set(), stack = [...hits];
  while (stack.length) {
    const iri = stack.pop();
    if (kept.has(iri)) continue;
    kept.add(iri);
    stack.push(...parentsOf(iri));
  }
  const kids = new Map(), roots = [];
  for (const iri of kept) {
    const ps = parentsOf(iri).filter(p => kept.has(p));
    if (!ps.length) roots.push(iri);
    for (const p of ps) { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(iri); }
  }
  for (const k of kids.values()) k.sort(byNodeName);
  return {roots: roots.sort(byNodeName), kids, hits};
}

async function searchAllSchemes(current) {
  if (!sk.text) { sk.hits = null; renderConcepts(); return; }
  renderConcepts('searching…');
  await probeTextIndex(knownWord());
  const inScheme = GIVEN_GRAPHS.length ? inGiven('gT', '?m skos:inScheme ?s') : '?m skos:inScheme ?s .';
  const ask = xl => {
    const m = labelMatch(sk.text, xl);
    return sparql(`${SKOS_PREFIX}SELECT ?m ?s (SAMPLE(?l) AS ?label) WHERE {
  ${m.bind} ${m.index} ${m.filter}
  ${inScheme}
} GROUP BY ?m ?s LIMIT ${PAGE}`);
  };
  let rows = await ask(false);
  if (!rows.length && current()) rows = await ask(true);
  if (!current()) return;
  sk.hits = rows.filter(b => b.m.type === 'uri' && iriSafe(b.m.value))
    .map(b => ({iri: b.m.value, label: b.label ? b.label.value : null, scheme: sk.byIri.get(b.s.value)}));
  renderConcepts();
}

function setSkos(on) {
  sk.on = on;
  document.body.classList.toggle('skos', on);
  skosBtn.hidden = !on && skosBtn.hidden;
  skosBtn.setAttribute('aria-pressed', String(on));
  clearTimeout(timer); timer = 0;
  target = 'list';
  sectionFilter.cls = sectionFilter.graph = sectionFilter.scheme = '';
  qEl.value = on ? sk.text : state.text;
  syncUrl();
  if (!on) { fold(false); renderFacets(); return refresh(); }
  fold(!!sk.scheme);
  renderSchemes();
  renderConcepts();
  return skosRefresh();
}

async function skosRefresh() {
  const s = document.getElementById('status');
  const current = take('skos');
  try {
    s.textContent = 'querying…';
    partial = false;
    await loadSettings();
    if (!sk.top) {
      await loadSchemes();
      if (!current()) return;
      renderSchemes();
      loadSchemeCounts(take('counts')).catch(fail);
      loadSchemeTitles(take('titles')).catch(fail);
      const want = wantScheme;
      wantScheme = null;
      if (want && sk.byIri.has(want)) selectScheme(want);
      else renderConcepts();
    }
    if (current()) s.textContent = connectedText();
  } catch (e) {
    if (current()) fail(e);
  }
}
const PANES = 'opsis-panes';
const detail = document.getElementById('detail');
const strip = document.getElementById('strip');
const results = document.getElementById('results');
let stacked = (new URLSearchParams(location.search).get('panes') || recall(PANES)) === 'stacked';
const panes = () => [...detail.querySelectorAll('.pane[data-iri]')];

function newPane(iri) {
  const p = document.createElement('div');
  p.className = 'pane';
  p.dataset.iri = iri;
  p.innerHTML = `<div class="spine" title="${esc(iri)}">${esc(short(iri))}</div>` +
    `<div class="body"><h2>Entity</h2><p class="t">loading…</p></div>`;
  return p;
}

function openEntity(iri, from) {
  if (phone.matches) return openOnPhone(iri, from);
  detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
  const open = panes();
  if (stacked) {
    const already = open.find(p => p.dataset.iri === iri);
    if (already) { reveal(already); return; }
    const k = from ? open.indexOf(from) : -1;
    open.slice(k + 1).forEach(p => p.remove());
  } else {
    detail.replaceChildren();
  }
  const p = newPane(iri);
  detail.append(p);
  loadDetail(iri, p).catch(fail);
  layout();
  reveal(p);
  syncUrl();
}

function layout() {
  panes().forEach((p, i) => { p.style.left = stacked ? `calc(${i + 1} * var(--spine))` : ''; });
  cover();
}
function reveal(p) {
  panes().forEach(q => q.classList.toggle('here', stacked && q === p));
  if (!stacked) return;
  const before = panes().slice(0, panes().indexOf(p));
  const at = before.reduce((x, q) => x + q.offsetWidth, results.offsetWidth);
  const spine = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spine')) || 36;
  strip.scrollTo({ left: Math.max(0, at - (before.length + 1) * spine), behavior: 'smooth' });
}
function cover() {
  const all = [results, ...panes()];
  all.forEach((p, i) => {
    const next = all[i + 1];
    const covered = stacked && !!next &&
      next.getBoundingClientRect().left - p.getBoundingClientRect().left < p.offsetWidth / 2;
    if (covered && !p.classList.contains('covered')) p.style.setProperty('--st', `${p.scrollTop}px`);
    p.classList.toggle('covered', covered);
  });
}
let coverFrame = 0;
const coverSoon = () => { cancelAnimationFrame(coverFrame); coverFrame = requestAnimationFrame(cover); };
strip.addEventListener('scroll', coverSoon, { passive: true });
addEventListener('resize', coverSoon);

function setStacked(on) {
  stacked = on;
  remember(PANES, on ? 'stacked' : 'single');
  document.body.classList.toggle('stacked', on && !phone.matches);
  detail.classList.toggle('stack', on);
  document.getElementById('panes').setAttribute('aria-pressed', String(on));
  if (!on) panes().slice(0, -1).forEach(p => p.remove());
  layout();
  syncUrl();
}

function syncUrl() {
  if (phone.matches) return;
  const params = new URLSearchParams(location.search);
  params.delete('open');
  for (const p of panes()) params.append('open', p.dataset.iri);
  if (stacked) params.set('panes', 'stacked');
  else params.delete('panes');
  if (sk.on) params.set('view', 'skos');
  else params.delete('view');
  if (sk.on && sk.scheme) params.set('scheme', sk.scheme.iri);
  else params.delete('scheme');
  const q = params.toString();
  history.replaceState(null, '', q ? `?${q}` : location.pathname);
}

const phone = matchMedia('(pointer: coarse) and (max-width: 640px), (pointer: coarse) and (max-height: 500px)');
const mainEl = document.querySelector('main');
const nav = document.getElementById('nav');
let atPage = 0;
let slideBack = false;
const pages = () => [facetsEl, results, ...panes()];
const firstPage = () => !sk.on && offered.cls !== null && !facetsEl.querySelector('.facet') ? 1 : 0;

function show(n, instant) {
  const all = pages();
  atPage = Math.min(Math.max(n, firstPage()), all.length - 1);
  void mainEl.offsetWidth;
  mainEl.classList.toggle('instant', !!instant);
  mainEl.style.setProperty('--at', atPage);
  if (instant) { void mainEl.offsetWidth; mainEl.classList.remove('instant'); }
  all.forEach((p, i) => { p.inert = i !== atPage; });
  renderNav();
}

function renderNav() {
  if (!phone.matches) return;
  nav.hidden = atPage <= firstPage();
  if (nav.hidden) return;
  const name = n => n === 0 ? (sk.on ? 'Schemes' : shown('cls') || pinned().length ? 'Classes' : 'Graphs')
    : n === 1 ? (sk.on ? 'Concepts' : 'Entities') : panes()[n - 2].querySelector('.spine').textContent;
  document.getElementById('back').textContent = `‹ ${name(atPage - 1)}`;
  document.getElementById('scope').innerHTML = atPage !== 1 || sk.on ? '' :
    ['cls', 'graph'].filter(k => state[k]).map(k => {
      const nm = esc(facetName(k, state[k]).value);
      return `<button class="chip" data-clear="${k}" aria-label="Clear ${nm}">${nm} ×</button>`;
    }).join('');
}

function goTo(n) {
  const from = atPage;
  show(n);
  history.pushState({opsis: true, at: atPage, up: atPage === from + 1}, '', phoneHref());
}
function phoneHref() {
  const params = new URLSearchParams(location.search);
  params.delete('open');
  for (const p of panes().slice(0, Math.max(0, atPage - 1))) params.append('open', p.dataset.iri);
  const q = params.toString();
  return q ? `?${q}` : location.pathname;
}

function openOnPhone(iri, from) {
  detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
  const open = panes();
  const k = from ? open.indexOf(from) : -1;
  if (!open[k + 1] || open[k + 1].dataset.iri !== iri) {
    open.slice(k + 1).forEach(p => p.remove());
    const p = newPane(iri);
    detail.append(p);
    loadDetail(iri, p).then(renderNav, fail);
  }
  goTo(k + 3);
}

function restore(want, n, instant, ready = Promise.resolve()) {
  const open = panes();
  let i = 0;
  while (i < want.length && open[i] && open[i].dataset.iri === want[i]) i++;
  if (i < want.length) {
    detail.querySelectorAll('.pane:not([data-iri])').forEach(p => p.remove());
    open.slice(i).forEach(p => p.remove());
    for (const iri of want.slice(i)) {
      const p = newPane(iri);
      detail.append(p);
      ready.then(() => loadDetail(iri, p)).then(renderNav, fail);
    }
  }
  show(n ?? (want.length ? want.length + 1 : 0), instant);
}

document.getElementById('back').addEventListener('click', () => {
  if (history.state && history.state.up) { slideBack = true; history.back(); }
  else goTo(atPage - 1);
});
addEventListener('popstate', e => {
  if (!phone.matches) return;
  restore(new URLSearchParams(location.search).getAll('open'),
          e.state && e.state.opsis ? e.state.at : null, !slideBack);
  slideBack = false;
});
document.addEventListener('click', e => {
  if (!phone.matches) return;
  if (e.target.closest('[data-clear]')) { renderNav(); return; }
  if (e.target.closest('[data-group]')) return;
  if (e.target.closest('[data-scheme]')) { if (sk.scheme) goTo(1); return; }
  const f = e.target.closest('.facet');
  if ((f && !e.target.closest('button.pin') && state[f.dataset.key] === f.dataset.v)
      || e.target.closest('[data-cls]')) goTo(1);
});
qEl.addEventListener('input', () => {
  if (phone.matches && target === 'list' && atPage !== 1 && qEl.value.trim()) goTo(1);
});
qEl.addEventListener('keydown', e => { if (phone.matches && e.key === 'Enter') qEl.blur(); });
phone.addEventListener('change', () => {
  if (phone.matches) {
    setStacked(stacked);
    show(panes().length ? panes().length + 1 : state.cls || state.graph || state.text ? 1 : 0, true);
    history.replaceState({opsis: true, at: atPage, up: false}, '', phoneHref());
    return;
  }
  panes().slice(Math.max(0, atPage - 1)).forEach(p => p.remove());
  pages().forEach(p => { p.inert = false; });
  nav.hidden = true;
  mainEl.style.removeProperty('--at');
  setStacked(stacked);
});

const reopen = new URLSearchParams(location.search).getAll('open');
const landing = history.state;
setStacked(stacked);
const started = sk.on ? setSkos(true) : refresh();
if (phone.matches) {
  restore(reopen, null, true, started);
  history.replaceState({opsis: true, at: atPage,
    up: !!(landing && landing.up && landing.at === atPage)}, '', phoneHref());
  started.then(() => {
    if (atPage >= firstPage()) return;
    show(firstPage(), true);
    history.replaceState({opsis: true, at: atPage, up: false}, '', phoneHref());
  });
} else {
  started.then(() => {
    let from = null;
    for (const iri of stacked ? reopen : reopen.slice(-1)) {
      openEntity(iri, from);
      from = panes().at(-1);
    }
  });
}
</script>
